<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>Library · Mockup Placements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: the product fills the window. Wide (768px+) gets the product top bar + icon rail; compact gets a top bar, bottom sheets and a sticky action bar.
   Committed single light look to match the Marketplace product. */
:root{
  color-scheme: light;
  --chrome-bg:#1c2027; --chrome-fg:#e9ecf1; --chrome-mute:#9aa3b2; --chrome-line:#323844;
  --stage:#dfe3e8;
  --page:#f2f2f2; --surface:#ffffff; --surface-2:#f7f7f7; --surface-3:#ededed;
  --text:#161616; --text-2:#5c5c5c; --text-3:#8f8f8f;
  --border:#e3e3e3; --border-2:#d1d1d1;
  --accent:#176BF5; --accent-2:#0f4fba; --accent-bg:#eaf1fe; --accent-border:#bcd5fb;
  --success:#0f7a54; --success-bg:#e6f4ee;
  --warn:#8a5a00; --warn-bg:#fdf1dc;
  --danger:#b42318; --danger-bg:#fdecea;
  --brand:#e3122b; --org:#7b4bd6;
  --scrim:rgba(14,17,22,.48);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.07);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-sm:4px; --r-md:6px; --r-lg:8px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}

/* ---------- App frame ---------- */
#screen{min-height:100dvh;display:flex;flex-direction:column}
#screen>*{flex:none}
#screen>.grow{flex:1 0 auto}
.app.wide #screen.enter .d-main,.app.compact #screen.enter>:not(.topbar):not(.actionbar){animation:enter .26s cubic-bezier(.2,.7,.3,1) both}
.swipe img{-webkit-user-drag:none;pointer-events:none}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}

/* ---------- App shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px}
/* Product wordmark: white on a red block, as shipped */
.wordmark{display:inline-flex;align-items:center;height:32px;padding:0 8px 2px;border-radius:4px;background:var(--brand);color:#fff;font-size:24px;font-weight:600;letter-spacing:-.05em;line-height:1}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:8px}
.iconbtn:hover{background:var(--surface-2)}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* Wide shell matches the shipped product: top bar (logo, help, avatar) + 68px icon rail */
.d-shell{display:flex;flex-direction:column;flex:1 0 auto!important;min-height:100dvh}
.ptop{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:16px;height:60px;padding:0 20px 0 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.ptop .wordmark{height:36px;font-size:27px;padding:0 9px 2px}
.ptop .sp{flex:1}
.phelp{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r-md);color:var(--text)}
.phelp:hover{background:var(--surface-2)}
.phelp .icon{width:24px;height:24px}
.pav{width:36px;height:36px;border-radius:50%;background:var(--org);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600}
.pbody{display:grid;grid-template-columns:68px minmax(0,1fr);flex:1 0 auto}
.prail{position:sticky;top:60px;height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;background:var(--surface);border-right:1px solid var(--border)}
.porg{width:40px;height:40px;border-radius:8px;background:var(--org);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:600;margin-bottom:6px}
.pnav{position:relative;width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:var(--text);border:2px solid transparent;transition:background .15s}
.pnav .icon{width:24px;height:24px;stroke-width:1.7}
.pnav:hover{background:var(--surface-2)}
.pnav[aria-current="page"]{border-color:var(--accent);background:var(--surface-2)}
.pnav::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translate(-4px,-50%);background:#232a33;color:#fafafa;font-size:12px;font-weight:500;padding:5px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s,transform .12s;z-index:20}
.pnav:hover::after,.pnav:focus-visible::after{opacity:1;transform:translate(0,-50%)}
.d-main{padding:28px clamp(24px,3.5vw,48px) 64px;min-width:0;width:100%;max-width:1320px}
.m-main{padding:20px 16px 40px;display:flex;flex-direction:column;gap:20px;width:100%;max-width:760px;margin-inline:auto}

/* ---------- Type + buttons ---------- */
.title{font-size:24px;font-weight:600;letter-spacing:-.01em}
.title small{font-size:14px;font-weight:400;color:var(--text-3);margin-left:8px;letter-spacing:0}
.h2{font-size:20px;font-weight:600;line-height:1.3}
.h3{font-size:16px;font-weight:600}
.muted{color:var(--text-2);line-height:1.45}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:var(--r-md);font-weight:600;font-size:15px;white-space:nowrap}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.secondary{background:var(--surface);border:1px solid var(--border-2)}
.btn.secondary:hover{background:var(--surface-2)}
.btn.block{width:100%}
.btn.sm{padding:9px 14px;font-size:14px}
.link{color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}
.card{background:var(--surface);border-radius:var(--r-lg)}
.panel.card{border:1px solid var(--border)}
.raised{box-shadow:var(--shadow)}

/* ---------- Billboard scene ---------- */
.scene{position:relative;width:100%;aspect-ratio:17/10;border-radius:var(--r-md);overflow:hidden;container-type:inline-size;background:#9cc9ef;isolation:isolate}
.scene .l{position:absolute}
.scene .chip-ex{position:absolute;left:2.5%;bottom:3.5%;z-index:4;background:rgba(255,255,255,.72);color:#4a4f57;font-size:max(9px,1.7cqw);font-weight:500;letter-spacing:.01em;padding:.35em .6em;border-radius:3px;line-height:1}
.face{position:absolute;overflow:hidden;container-type:size;z-index:2;background:#222}
.frame{position:absolute;background:#2b2f36;z-index:1;border-radius:1px}
.art{position:absolute;inset:0;display:flex;overflow:hidden}
.art.text{flex-direction:column;justify-content:center;padding:6cqh 6cqw;gap:3cqh}
.art .hl{font-weight:800;line-height:1.04;letter-spacing:-.01em;font-size:min(27cqh,8.6cqw);text-wrap:balance}
.art .sub{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:min(9cqh,2.6cqw);opacity:.9}
.art.split .copy{display:flex;flex-direction:column;justify-content:center;gap:3cqh;flex:1;min-width:0;padding:6cqh 0 6cqh 6cqw}
.art.split .pic{flex:0 0 34%;display:grid;place-items:center}
.tire{width:min(78cqh,28cqw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 50%,#c9ced6 0 18%,#2a2d33 19% 33%,#111 34% 100%);box-shadow:inset 0 0 0 min(3cqh,1cqw) #3a3e45}
.art.logo{flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:4cqh;padding:6cqh 6cqw}
.art.logo .hl{font-size:min(30cqh,9cqw);letter-spacing:.02em}
.art.img img{width:100%;height:100%;display:block}
.flat{position:relative;width:100%;aspect-ratio:3.5/1;border-radius:8px;overflow:hidden;container-type:size;border:1px solid var(--border)}
.flat-img{width:100%;border-radius:8px;border:1px solid var(--border);display:block}

/* ---------- Hub ---------- */
.hero{display:flex;flex-direction:column;gap:16px;padding:12px 12px 16px}
.hero .copy{display:flex;flex-direction:column;gap:6px;padding-inline:4px}
.hero .actions{display:flex;flex-direction:column;gap:10px;padding-inline:4px}
.d-hero{display:grid;grid-template-columns:1.25fr 1fr;gap:32px;align-items:center;padding:20px}
.d-hero .copy{display:flex;flex-direction:column;gap:10px}
.d-hero .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.tips{padding:16px;display:flex;flex-direction:column;gap:12px}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip b+span{display:block;margin-top:2px}
.num{width:28px;height:28px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.tip b{display:block;font-weight:600;font-size:14px}
.tip span{color:var(--text-2);font-size:13px}
.carousel-x{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-inline:-16px;padding-inline:16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.excard{flex:0 0 232px;scroll-snap-align:start;padding:8px 8px 10px;display:flex;flex-direction:column;gap:8px;text-align:left}
.excard{border:1px solid var(--border)}
.excard b{font-size:13px;font-weight:600;padding-inline:2px}
.excard span{font-size:12px;color:var(--text-2);line-height:1.4;padding-inline:2px;margin-top:-4px}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.ex-grid .excard{flex:none}
@media (max-width:1099px){.d-hero{grid-template-columns:1fr 1fr;gap:24px}}

.toolbar{display:flex;flex-direction:column;gap:12px}
.d-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.toggle{display:flex;background:var(--surface-3);border-radius:8px;padding:4px;gap:4px}
.toggle button{flex:1;padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;color:var(--text-2)}
.toggle button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.chip{flex:none;padding:7px 12px;border-radius:var(--r-md);font-size:13px;font-weight:500;background:var(--surface);border:1px solid var(--border-2);white-space:nowrap}
.chip[aria-pressed="true"],.chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent-2);font-weight:600}
.chip.on select{color:var(--accent-2);font-weight:600}
.chip select{border:0;background:transparent;font-size:13px;font-weight:500;padding:0;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.app.compact .grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.list{display:flex;flex-direction:column;gap:12px}
.dcard{padding:10px 10px 12px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.dcard:hover{box-shadow:var(--shadow)}
.dcard .meta{display:flex;justify-content:space-between;align-items:center;padding-inline:4px;gap:8px}
.dcard .meta b{display:block;font-size:15px;font-weight:600}
.dcard .meta span{font-size:13px;color:var(--text-2)}
.promo{position:relative;display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;padding:12px 44px 12px 12px;background:linear-gradient(100deg,#eaf1fe,#ffffff 70%);border:1px solid var(--accent-border)}
.promo .copy{display:flex;flex-direction:column;gap:4px;min-width:0}
.promo .copy b{font-size:15px;font-weight:600;line-height:1.3}
.promo .copy span{font-size:13px;color:var(--text-2);line-height:1.4}
.promo .acts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:6px}
.promo .x{position:absolute;top:6px;right:6px;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--text-2)}
.promo .x:hover{background:rgba(0,0,0,.05)}
.promo.m{grid-template-columns:1fr;padding:12px}
.promo.m .top{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;padding-right:28px}
.d-promo{grid-template-columns:220px 1fr;padding:16px 56px 16px 16px;gap:22px}
.d-promo .copy b{font-size:17px}
.d-promo .copy span{font-size:14px}
.empty-filter{padding:28px;text-align:center;color:var(--text-2)}
.rowlink{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:600;width:100%;text-align:left}

/* Library tiles: the creative itself on a neutral stage, not a scene. Scenes live on the detail page. */
.tile{position:relative;aspect-ratio:16/9;background:var(--surface-2);border-radius:var(--r-md);display:grid;place-items:center;padding:12px;overflow:hidden}
.tile .flat,.tile .flat-img{width:100%;max-height:100%;box-shadow:0 1px 2px rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.08);border:0;border-radius:3px}
.tile .flat-img{object-fit:contain;width:auto;max-width:100%}
.dcard{border:1px solid var(--border)}
.app.compact .tile{aspect-ratio:2.4/1;padding:10px}
.dcard:hover{border-color:var(--border-2)}
.strip{display:flex;align-items:center;gap:12px;padding:10px 8px 10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);font-size:14px;color:var(--text-2)}
.strip .ic-s{color:var(--accent);flex:none;display:grid}
.strip p{flex:1;min-width:0;line-height:1.4}
.strip p b{color:var(--text);font-weight:600}
.strip .x{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-md);color:var(--text-3);flex:none}
.strip .x:hover{background:var(--surface-2);color:var(--text)}
.status{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);flex-wrap:wrap}
.status .ok{display:inline-flex;align-items:center;gap:4px;color:var(--success);font-weight:500}
.status .ok .icon{width:16px;height:16px}
.status .sep{color:var(--text-3)}
.tiprow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.tiprow .tip,.tips .tip{flex-direction:column;gap:2px}
.tips-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}

/* ---------- Detail ---------- */
.back{display:flex;align-items:center;gap:4px;font-weight:600;font-size:17px;min-width:0}
.back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv{display:flex;flex-direction:column;gap:12px;padding:12px 16px 4px;width:100%;max-width:760px;margin-inline:auto}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:#c4c4c4}
.dots i.on{width:8px;height:8px;background:var(--text)}
.swipe{touch-action:pan-y;user-select:none;position:relative}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:var(--shadow);display:grid;place-items:center}
.arrow.prev{left:10px}.arrow.next{right:10px}
.scene-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.schip{flex:none;padding:7px 12px;border-radius:var(--r-md);font-size:13px;font-weight:500;border:1px solid var(--border-2);background:var(--surface);white-space:nowrap}
.schip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent-2);font-weight:600}
.details{display:flex;flex-direction:column;gap:12px;padding:12px 16px 20px;width:100%;max-width:760px;margin-inline:auto}
.ready{display:flex;gap:10px;align-items:center;background:var(--success-bg);color:var(--success);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:500}
.panel{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.panel .head{display:flex;justify-content:space-between;align-items:baseline}
.thumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.thumb{flex:0 0 140px;border-radius:var(--r-md);overflow:hidden;border:2px solid transparent;padding:0}
.thumb[aria-pressed="true"]{border-color:var(--accent)}
.actionbar{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.actionbar>*{width:100%;max-width:728px;margin-inline:auto}
.sec-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sa{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:8px;background:var(--surface-2);font-size:11px;font-weight:500}
.sa:hover{background:var(--surface-3)}
.d-detail{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:28px;align-items:start}
@media (max-width:1179px){.d-detail{grid-template-columns:minmax(0,1fr)}}
.d-side{display:flex;flex-direction:column;gap:14px}
.d-side .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.d-side .sa{background:var(--surface);border:1px solid var(--border-2);font-size:12px;padding:10px 4px}
.d-side .sa:hover{background:var(--surface-2)}
.crumb{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:13px;margin-bottom:14px}
.crumb button{color:var(--accent);font-weight:500}

/* ---------- Maker / upload / campaign ---------- */
.flow{display:flex;flex-direction:column;gap:18px;padding:20px 16px 40px;max-width:640px;margin-inline:auto;width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.input{width:100%;padding:12px 14px;border:1px solid var(--border-2);border-radius:var(--r-md);background:var(--surface);font-size:15px}
.input[aria-invalid="true"]{border-color:var(--danger)}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.notice{background:var(--accent-bg);color:var(--accent-2);border-radius:10px;padding:10px 12px;font-size:13px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:40px 24px;flex:1 0 auto}
.progress{width:200px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;width:30%;background:var(--accent);border-radius:3px;animation:load 1.8s ease-in-out forwards}
@keyframes load{to{width:100%}}
.options{display:flex;flex-direction:column;gap:12px}
.d-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.opt{padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left;border:2px solid transparent}
.opt[aria-pressed="true"]{border-color:var(--accent)}
.opt b{font-size:14px}
.opt span{font-size:12px;color:var(--text-2)}
.drop{border:2px dashed var(--border-2);border-radius:12px;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface-2);cursor:pointer;width:100%}
.drop.over{border-color:var(--accent);background:var(--accent-bg)}
.pick{display:flex;flex-direction:column;gap:12px}
.pickcard{padding:10px;display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;border:2px solid transparent;text-align:left}
.pickcard[aria-pressed="true"]{border-color:var(--accent)}
.pickcard .flat{border:0}
.steps{font-size:13px;color:var(--text-2);font-weight:500}

/* ---------- Sheets + modals + toast ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;animation:fade .18s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:16px 16px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88dvh;overflow-y:auto;animation:sheetin .28s cubic-bezier(.2,.8,.2,1)}
.scrim.out{animation:fadeout .16s ease-in forwards}
.scrim.still:not(.out),.sheet.still:not(.out){animation:none!important}
.sheet.out{animation:sheetout .18s ease-in forwards}

  .sheet.out{animation:popout .15s ease-in forwards}
  .handle{display:none}
}
@keyframes sheetin{from{transform:translateY(100%)}}

@keyframes pop{from{opacity:0;transform:translate(-50%,-47%)}}

/* ---------- Motion + live feedback ---------- */
.btn{transition:background .15s,transform .1s,box-shadow .15s}
.btn:active,.sa:active,.chip:active,.schip:active{transform:scale(.97)}
.dcard,.opt{transition:border-color .15s,box-shadow .2s,transform .2s}
.dcard:hover,.opt:hover{transform:translateY(-2px);box-shadow:var(--shadow)}

.swipe{cursor:grab}
.swipe.dragging{cursor:grabbing}
.swipe .scene{transition:transform .22s cubic-bezier(.2,.7,.3,1)}
.swipe.dragging .scene{transition:none}
.scene.swap{animation:fade .3s ease-out}
.scene.loading .face::after{content:"";position:absolute;inset:0;z-index:3;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:220% 100%;animation:sweep 1.3s linear infinite}

@media (min-width:640px){.sheet.wide{width:min(860px,calc(100vw - 32px))}.sheet.wide .mv-stage{width:min(100%,calc((100dvh - 470px) * 1.7));margin-inline:auto}.sheet.wide .mv-caption{width:100%}}
.app.compact .mm-acts .btn.primary{flex:1 1 100%}

/* Prototype state switcher: dark so it never reads as product UI */
/* Two axes: Scenario = what data the account has; Step = where in the flow. ‹ › walk the steps in order. */
.statepick{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:75;color:#fafafa;font-size:13px;transition:bottom .2s}
.statepick .icon{width:16px;height:16px}
.sp-body{display:flex;align-items:center;gap:6px;background:#232a33;border-radius:999px;padding:4px 6px 4px 14px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.sp-body>.icon{color:#9aa3b2;margin-right:2px}
.sp-f{display:flex;align-items:center;gap:6px;min-width:0}
.sp-lbl{color:#9aa3b2;white-space:nowrap;font-size:12px}
.statepick select{background:transparent;color:inherit;border:0;font-weight:600;font-size:13px;max-width:300px;cursor:pointer;padding:5px 2px}
.statepick select:focus-visible{outline:2px solid #8fb6fb;outline-offset:2px;border-radius:4px}
.statepick select option,.statepick select optgroup{color:#161616;background:#fff}
.statepick select option:disabled{color:#a8a8a8}
.sp-div{width:1px;height:18px;background:#3d4552;margin:0 6px}
.sp-nav{display:flex;gap:2px}
.sp-hub{color:#fafafa;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;padding:4px 6px;border-radius:6px}
.sp-hub:hover{background:#3a4350}
.sp-nav button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fafafa}
.sp-nav button:hover{background:#3a4350}
.sp-nav button:disabled{opacity:.35;cursor:default;background:none}
.sp-toggle{display:none}
.statepick.compact{left:auto;right:16px}
.statepick.compact .sp-toggle{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#232a33;color:#fafafa;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.statepick.compact .sp-body{display:none;position:absolute;right:0;bottom:52px;width:min(320px,calc(100vw - 32px));flex-direction:column;align-items:stretch;gap:10px;border-radius:12px;padding:12px}
.statepick.compact.open .sp-body{display:flex}
.statepick.compact .sp-body>.icon,.statepick.compact .sp-div{display:none}
.statepick.compact .sp-f{flex-direction:column;align-items:stretch;gap:4px}
.statepick.compact select{max-width:none;width:100%;background:#2f3743;border-radius:6px;padding:8px}
.statepick.compact .sp-nav{justify-content:flex-end}
.statepick.compact .sp-nav button{width:36px;height:36px;background:#2f3743}
.statepick.lift{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.demo{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.demo button{text-align:left;font-size:13px;color:var(--text-2)}
.demo button:hover{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Fit rule, same ladder as the resize work: within 7% of the board's shape the creative is shown as is
   (scaled, or a small trim); more than 7% off and it is resized with AI. Every creative works in every location. */
const ratioOf = dim => { const [w,h] = dim.split('×').map(n => parseFloat(n)); return w / h; };

function fitFor(d, k){

}

function artHTML(d){
  if(d.kind === 'image'){
    const fit = (d.fit||'fill') === 'fit' ? 'contain' : 'cover';
    if(d.ext) return `<div class="art img ext"><img class="bgb" src="${d.img}" alt=""><img src="${d.img}" alt="" style="object-fit:contain"></div>`;
    return `<div class="art img" style="background:#111"><img src="${d.img}" alt="" style="object-fit:${fit};transform:scale(${(d.zoom||100)/100})"></div>`;
  }
  const st = `background:${d.bg};color:${d.fg}`;
  if(d.layout === 'split') return `<div class="art split" style="${st}"><div class="copy"><div class="hl">${esc(d.headline)}</div><div class="sub">${esc(d.sub)}</div></div><div class="pic"><div class="tire"></div></div></div>`;
  if(d.layout === 'logo') return `<div class="art logo" style="${st}"><div class="hl">${esc(d.headline)}</div><div class="sub">${esc(d.sub)}</div></div>`;
  return `<div class="art text" style="${st}"><div class="hl">${esc(d.headline)}</div><div class="sub">${esc(d.sub)}</div></div>`;
}
function scene(d, key='highway', opts={}){
  const s = sceneLayers(key);
  const f = s.face, hPct = f.w * 1.7 / f.ratio;

  const glow = s.glow ? 'box-shadow:0 0 6cqw rgba(255,236,190,.45);' : '';
  return `<div class="scene ${opts.cls||''}" style="background:${s.bg}">${s.layers}${frame}<div class="face" style="left:${f.l}%;top:${f.t}%;width:${f.w}%;height:${hPct}%;${glow}">${opts.fitRatio ? `<div class="fitwrap"><div class="fitbox" style="aspect-ratio:${opts.fitRatio};${opts.fitRatio > f.ratio ? 'width:100%' : 'height:100%'}">${artHTML(d)}</div></div>` : artHTML(d)}</div>${opts.label===false?'':'<span class="chip-ex">Example placement</span>'}</div>`;

function productImage(label, bg, fg, shape){
  try{
    const c = document.createElement('canvas'); c.width = 800; c.height = 800; const g = c.getContext('2d');
    g.fillStyle = bg; g.fillRect(0,0,800,800);
    g.fillStyle = 'rgba(0,0,0,.08)'; g.beginPath(); g.ellipse(400,640,230,40,0,0,Math.PI*2); g.fill();
    g.fillStyle = fg;
    if(shape === 'tire'){ g.beginPath(); g.arc(400,380,220,0,Math.PI*2); g.fill(); g.fillStyle = bg; g.beginPath(); g.arc(400,380,110,0,Math.PI*2); g.fill(); g.fillStyle = '#c9ced6'; g.beginPath(); g.arc(400,380,70,0,Math.PI*2); g.fill(); }
    else if(shape === 'bottle'){ g.fillRect(310,250,180,380); g.fillRect(360,170,80,90); g.fillStyle = '#fff'; g.fillRect(330,360,140,120); }
    else if(shape === 'card'){ g.save(); g.translate(400,390); g.rotate(-.12); g.fillRect(-230,-140,460,280); g.fillStyle = '#fff'; g.font = '700 54px Inter, Arial'; g.textAlign = 'center'; g.fillText('GIFT CARD', 0, 18); g.restore(); }
    else { g.fillRect(190,300,420,160); g.fillRect(240,240,320,80); g.fillStyle = '#fff'; g.fillRect(230,330,120,60); g.fillRect(450,330,120,60); }
    g.fillStyle = 'rgba(0,0,0,.55)'; g.font = '600 40px Inter, Arial'; g.textAlign = 'center'; g.fillText(label, 400, 740);
    return c.toDataURL('image/jpeg', .85);
  }catch(e){ return ''; }
}

const DIMENSIONS = ['1400 × 400','840 × 400','1920 × 1080','1080 × 1920','1200 × 1200','1200 × 628'];
const MON = 'JanFebMarAprMayJunJulAugSepOctNovDec';
const when = str => { const [m,d,y] = str.replace(',','').split(' '); return new Date(+y, MON.indexOf(m)/3, +d).getTime(); };
const dimText = d => `${d.dims.length} dimension${d.dims.length>1?'s':''}`;
const isFiltered = () => state.filter !== 'all' || state.q.trim() || state.dim;
function filtered(){
  const f = state.filter, q = state.q.trim().toLowerCase();
  const list = state.designs.filter(d =>
    (f==='all' ? true : f==='used' ? d.usedIn.length>0 : f==='unused' ? d.usedIn.length===0 : d.usedIn.includes(f)) &&
    (!q || d.name.toLowerCase().includes(q)) &&
    (!state.dim || d.dims.includes(state.dim)));
  const k = state.sort, sign = state.dir === 'asc' ? 1 : -1;
  return list.sort((a,b) => sign * (k === 'name' ? a.name.localeCompare(b.name) : when(a[k]) - when(b[k])));

/* Scene for a creative at a location: as is, an instant fit while the AI resize runs, or the resized result */
function placed(d, k, opts={}){
  const {src, needsResize} = fitFor(d, k);
  if(!needsResize || resized[resizeKey(d, k)]) return scene(needsResize && d.kind === 'image' ? {...d, ext:true} : d, k, opts);
  return scene(d, k, {...opts, fitRatio: src});
}
function startResize(d, k){
  const key = resizeKey(d, k);
  if(!fitFor(d, k).needsResize || resized[key] || startResize.running[key]) return;
  startResize.running[key] = true;
  setTimeout(() => {
    resized[key] = true; delete startResize.running[key];
    const t = state.sheet?.type === 'mm2' ? state.sheet : state.route;
    if(t && t.id === d.id){ if(t === state.sheet) renderOverlay(); else if(state.route.name === 'detail') render(); animScene(); }
  }, 2200);
}
startResize.running = {};

   collapsible Dimensions (open) and Details (closed), and one footer: Delete · Replace file · Add dimension.
   ✕, Esc or a click on the dim area closes it. */
const DIM_RANK = ['1400 × 400','840 × 400','1920 × 1080','1080 × 1920','1200 × 1200','1200 × 628'];
const dimWH = s => s.split(' × ').map(Number);
const dimRows = d => [d.dims[0], ...d.dims.slice(1).sort((a,b) => DIM_RANK.indexOf(a) - DIM_RANK.indexOf(b))];
const dimTag = (d, i) => i === 0 ? d.src : 'Resized with AI';
const fitBox = (w, h, bw, bh) => { const k = Math.min(bw/w, bh/h); return [Math.max(4, Math.round(w*k)), Math.max(3, Math.round(h*k))]; };
const CHEV = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

  const sec = (key, title, count, body) => `<div class="spsec"><button class="spsech" data-act="panelSec" data-k="${key}" aria-expanded="${!!p.open[key]}"><span class="t">${title}</span>${count != null ? `<span class="n">${count}</span>` : ''}<span class="sp"></span>${CHEV.replace('class="chev"', `class="chev${p.open[key]?' up':''}"`)}</button>${p.open[key] ? `<div class="spsecb">${body}</div>` : ''}</div>`;
  const head = p.renaming
    ? `<div class="tt"><input class="sprename" id="panelName" maxlength="100" value="${esc(d.name)}" aria-label="Creative name">
        <div class="sprow"><span class="spcount" id="panelCount">${d.name.length} / 100</span><span class="sp"></span><button class="btn secondary sm" data-act="panelRenameCancel">Cancel</button><button class="btn primary sm" data-act="panelRenameSave">Save</button></div></div>`
    : `<div class="tt"><div class="spname"><h3 title="${esc(d.name)}">${esc(d.name)}</h3><button class="link" data-act="panelRename">Rename</button></div></div>`;
  const sw = s => { const [bw, bh] = fitBox(...dimWH(s), 44, 30); return `<span class="vsw"><i style="width:${bw}px;height:${bh}px;background:${d.kind === 'image' ? '#4d7fb8' : d.bg}"></i></span>`; };
  const dimsBody = `<div class="vlist">${rows.map((s, i) => `<button class="vrow ${i===n?'on':''}" data-act="panelSel" data-n="${i}">${sw(s)}<span class="pinfo">${s} px</span><span class="tag">${dimTag(d, i)}</span></button>`).join('')}</div>`;
  const field = (l, v) => `<div class="fld"><p class="fl">${l}</p><div class="fv">${v}</div></div>`;
  const detailsBody = field('Campaigns', d.usedIn.length ? `<ul class="camps">${d.usedIn.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : 'Not in a campaign')
    + field('Type', d.kind === 'image' ? 'JPG image' : 'Generated design') + field('Added', d.added) + field('Updated', d.updated);
  const [pw, ph] = fitBox(w, h, 430, 186);
  const art = d.kind === 'image' ? `<img class="flat-img" src="${d.img}" alt="${esc(d.name)} artwork">` : `<div class="flat" style="aspect-ratio:${w}/${h}">${artHTML(d)}</div>`;
  return `<div class="spveil ${p.enter?'enter':''}" data-act="panelClose"><aside class="spanel" role="dialog" aria-label="Creative details">
    <div class="sphead">${head}<button class="spx" data-act="panelClose" aria-label="Close">✕</button></div>

      <button class="btn secondary sm" data-act="panelReplace">Replace file</button><button class="btn secondary sm" data-act="panelAddDim">Add dimension</button></div>
  </aside></div>`;
}

function runLive(ms, done){
  const items = [...document.querySelectorAll('#live li')];
  items.forEach((li, i) => {
    later(() => { if(i) items[i-1].className = 'done'; li.className = 'on'; }, i * ms);

/* This prototype covers one thread of Mockup Placements; the others are sibling files linked from index.html */
const THREAD_GROUPS = ['My Library', 'Creative', 'Add creatives'];
const STEPS = ALL_STEPS.filter(([g]) => THREAD_GROUPS.includes(g));
const START = 'library';
const STEP_LIST = STEPS.flatMap(([, opts]) => opts);
const stepOk = (k, sc) => (STEP_LIST.find(s => s[0] === k)?.[2] || []).includes(sc);
$('#scenarioSel').innerHTML = SCENARIOS.map(([k,l]) => `<option value="${k}">${l}</option>`).join('');
$('#stateSel').innerHTML = STEPS.map(([g,opts]) => `<optgroup label="${g}">${opts.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</optgroup>`).join('');
function currentScenario(){
  if(!state.designs.length) return 'empty';
  return 'full';
}
function currentState(){
  const r = state.route, sh = state.sheet;
  if(sh){ if(sh.type === 'more') return sh.confirm ? 'delete' : ''; if(['share','mm1','mm3','addUrl','addShopify','addCanva'].includes(sh.type)) return sh.type; if(sh.type === 'mm2') return fitFor(getD(sh.id), sh.k || 'highway').needsResize ? 'mm2Resize' : 'mm2'; return ''; }
  if(r.name === 'campaignNew') return 'campaignNew';
  if(r.name === 'hub' && state.addMenu) return 'addMenu';
  if(r.name === 'home') return 'home' + state.dashBanner;
  const p = state.panel; if(r.name === 'hub' && p) return p.renaming ? 'panelRename' : p.open.details ? 'panelDetails' : getD(p.id)?.kind === 'image' ? 'panelUpload' : 'panel';
  if(r.name === 'hub'){ if(!state.designs.length) return 'library'; return GEN() && state.promo === 'strip' ? 'launchStrip' : state.view === 'list' ? 'libraryList' : 'library'; }
  if(r.name === 'uploading') return 'uploading';
  return '';
}
function loadScenario(sc){
  setLibrary(sc === 'empty' ? 'empty' : 'full');
  state.view = 'cards'; state.promo = 'card';
}
function freezeLive(doneN){ document.querySelectorAll('#live li').forEach((li,i) => li.className = i < doneN ? 'done' : i === doneN ? 'on' : ''); }
function jump(k, sc = $('#scenarioSel').value){
  if(!stepOk(k, sc)) k = STEP_LIST.find(s => s[2].includes(sc))?.[0] || 'library';
  loadScenario(sc);
  closing = false; state.toast = null;
  switch(k){
    case 'library': go({name:'hub'}); break;
    case 'home5': case 'home7': state.dashBanner = k.slice(-1); state.dashOff = false; go({name:'home'}); break;
    case 'libraryList': state.view = 'list'; go({name:'hub'}); break;
    case 'launchStrip': state.promo = 'strip'; go({name:'hub'}); break;
    case 'addMenu': go({name:'hub'}); state.addMenu = true; render(); break;
    case 'mm1': go({name:'hub'}); openSheet({type:'mm1'}); break;
    case 'mm2': go({name:'hub'}); openSheet({type:'mm2', id:'d1', k:'highway'}); break;
    case 'mm2Resize': go({name:'hub'}); delete resized['d2:1400 × 400']; openSheet({type:'mm2', id:'d2', k:'highway'}); break;
    case 'mm3': go({name:'hub'}); openSheet({type:'mm3', id:'d1', k:'highway'}); break;
    case 'campaignNew': go({name:'campaignNew', id:'d1', from:'mockup', back:{name:'hub'}}); break;
    case 'panel': go({name:'hub'}); openPanel('d1'); break;
    case 'panelUpload': go({name:'hub'}); openPanel('d7'); break;
    case 'panelDetails': go({name:'hub'}); openPanel('d1'); state.panel.open.details = true; renderOverlay(); break;
    case 'panelRename': go({name:'hub'}); openPanel('d1'); state.panel.renaming = true; renderOverlay(); break;
    case 'delete': go({name:'hub'}); openPanel('d1'); openSheet({type:'more', id:'d1', confirm:true}); break;
    case 'share': go({name:'hub'}); openSheet({type:'mm3', id:'d1', k:'highway'}); openSheet({type:'share', id:'d1', k:'highway', back:{type:'mm3', id:'d1', k:'highway'}}); break;
    case 'addUrl': go({name:'hub'}); openSheet({type:'addUrl'}); break;
    case 'addShopify': case 'addCanva': go({name:'hub'}); state.conn[k === 'addShopify' ? 'shopify' : 'canva'] = false; openSheet({type:k, sel:[]}); break;
    case 'uploading': go({name:'uploading', img:SAMPLE_IMG}); freezeLive(1); break;
  }
  // The scenario is the starting data, so it stays put even when a step adds a creative
  $('#scenarioSel').value = sc; syncPicker(sc);
}
function stepBy(dir){
  const sc = $('#scenarioSel').value, ok = STEP_LIST.filter(s => s[2].includes(sc)).map(s => s[0]);
  const i = ok.indexOf($('#stateSel').value);
  const n = i < 0 ? (dir > 0 ? 0 : ok.length - 1) : i + dir;
  if(n >= 0 && n < ok.length) jump(ok[n], sc);
}
function syncPicker(sc){
  const sp = $('#statepick'), sel = $('#stateSel'), scs = $('#scenarioSel');
  sp.classList.toggle('compact', isM());
  if(!isM()) sp.classList.remove('open');
  if(sc) scs.value = sc;
  else if((currentScenario() === 'empty') !== (scs.value === 'empty')) scs.value = currentScenario(); // the library filled up or was emptied
  [...sel.options].forEach(o => { o.disabled = !stepOk(o.value, scs.value); });
  sel.value = currentState();
  const ok = STEP_LIST.filter(s => s[2].includes(scs.value)).map(s => s[0]), i = ok.indexOf(sel.value);
  $('#spPrev').disabled = i === 0; $('#spNext').disabled = i === ok.length - 1;
  $('#spToggle').setAttribute('aria-expanded', sp.classList.contains('open'));
}
$('#scenarioSel').addEventListener('change', e => { const cur = $('#stateSel').value; jump(stepOk(cur, e.target.value) ? cur : START, e.target.value); });
$('#stateSel').addEventListener('change', e => jump(e.target.value));
$('#spPrev').addEventListener('click', () => stepBy(-1));
$('#spNext').addEventListener('click', () => stepBy(1));
$('#spToggle').addEventListener('click', () => { $('#statepick').classList.toggle('open'); syncPicker(); });
document.addEventListener('click', e => { if(!e.target.closest('#statepick') && $('#statepick').classList.contains('open')){ $('#statepick').classList.remove('open'); syncPicker(); } });

/* ---------- Render ---------- */
function render(){
  $('#app').className = 'app ' + (isM() ? 'compact' : 'wide');
  const r = state.route; let html = '';
  if(r.name === 'hub') html = state.designs.length ? hubFull() : hubEmpty();
  else if(r.name === 'home') html = dashboard();
  else if(r.name === 'uploading') html = uploading();
  else if(r.name === 'campaignNew') html = campaignNew();
  const scr = $('#screen');
  scr.innerHTML = html;
  if(state.enter && !reduced()){ scr.classList.remove('enter'); void scr.offsetWidth; scr.classList.add('enter'); }
  state.enter = false; state.fx = null;
  bindScreen();
  renderOverlay();
}
function renderOverlay(){
  // A modal that is already open only re-renders its content: skip the open animation so it doesn't flash out and back in
  const wasOpen = !!$('#overlay .sheet:not(.out)');
  $('#overlay').innerHTML = panelHTML() + sheetHTML() + (state.toast ? `<div class="toast" role="status">${ic('check')}${esc(state.toast)}</div>` : '');
  if(wasOpen && state.sheet) $('#overlay').querySelectorAll('.scrim, .sheet').forEach(el => el.classList.add('still'));
  document.documentElement.style.overflow = state.sheet || state.panel ? 'hidden' : '';
  const pn = $('#panelName'); if(pn && document.activeElement !== pn){ pn.focus(); pn.select(); }
  bindOverlay();
  syncPicker();
}
function bindSwipe(root){
  root.querySelectorAll('[data-swipe]').forEach(el=>{
    let x0 = null;
    const sc = () => el.querySelector('.scene');
    el.addEventListener('pointerdown', e => { if(e.target.closest('button')) return; x0 = e.clientX; el.classList.add('dragging'); });
    el.addEventListener('pointermove', e => { if(x0 === null) return; sc().style.transform = `translateX(${(e.clientX - x0) * .35}px)`; });
    const end = e => { if(x0 === null) return; const dx = e.clientX - x0; x0 = null; el.classList.remove('dragging'); sc().style.transform = ''; if(Math.abs(dx) > 40) stepScene(dx < 0 ? 1 : -1); };
    el.addEventListener('pointerup', end); el.addEventListener('pointerleave', end); el.addEventListener('pointercancel', end);
  });
}
function bindScreen(){
  const scr = $('#screen');
  const cf = $('#campfilter'); if(cf) cf.onchange = e => { state.filter = e.target.value || 'all'; state.fx = 'list'; render(); };
  const df = $('#dimfilter'); if(df) df.onchange = e => { state.dim = e.target.value; state.fx = 'list'; render(); };
  const sb = $('#sortby'); if(sb) sb.onchange = e => { state.sort = e.target.value; state.dir = state.sort === 'name' ? 'asc' : 'desc'; state.fx = 'list'; render(); };
  const ls = $('#libsearch'); if(ls) ls.oninput = e => { state.q = e.target.value; render(); const i = $('#libsearch'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
  bindSwipe(scr);
}
function bindOverlay(){
  const ov = $('#overlay');
  const z = $('#zoom'); if(z){ z.oninput = e => { const d = getD(state.sheet.id); d.zoom = +e.target.value; document.querySelectorAll('.art.img img').forEach(i=>i.style.transform=`scale(${d.zoom/100})`); }; }
  const drop = $('#drop');
  if(drop){
    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.add('over')));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove('over')));
  }
  const uf = $('#urlForm'); if(uf) uf.onsubmit = e => {
    e.preventDefault(); const inp = $('#imgurl'), v = inp.value.trim(), err = $('#urlErr');
    const fail = m => { err.textContent = m; err.hidden = false; inp.setAttribute('aria-invalid','true'); inp.focus(); };
    if(!v) return fail('Enter a link to an image');
    if(!/^https?:\/\/\S+\.\S+/.test(v)) return fail('Enter a full link that starts with https://');
    const file = decodeURIComponent(v.split('?')[0].split('/').pop() || 'image-from-link');
    addDesign({name:file, kind:'image', img:SAMPLE_IMG, fit:'fill', zoom:100, dims:['1200 × 628'], src:'URL'});
    state.sheet = null; go({name:'hub'}); toast('Added from URL');
  };
  const rf = $('#renameForm'); if(rf) rf.onsubmit = e => {
    e.preventDefault(); const v = $('#newname').value.trim(); if(!v){ $('#newname').focus(); return; }
    const d = getD(state.sheet.id); d.name = v; state.sheet = null; render(); toast('Renamed');
  };
  bindSwipe(ov);
}

/* ---------- Actions ---------- */
function animScene(){ if(!reduced()) document.querySelectorAll('.mv-stage .scene').forEach(s=>s.classList.add('swap')); }
function stepScene(dir){
  const t = state.sheet?.type === 'mm2' ? state.sheet : state.route;
  const d = getD(t.id), cur = t.k || firstLoc(d), n = LOCATIONS.length;
  t.k = LOCATIONS[(LOCATIONS.findIndex(l => l.key === cur) + dir + n) % n].key;
  if(t === state.sheet) renderOverlay(); else render();
  animScene();
}
function addDesign(d){ d.id = 'n' + (uid++); d.added = d.updated = 'Oct 6, 2026'; d.dims = d.dims || ['1400 × 400']; d.src = d.src || (d.kind === 'image' ? 'Uploaded' : 'Generated'); d.usedIn = d.usedIn||[]; state.designs.unshift(d); if(state.lib==='empty') state.lib = 'full'; return d; }
function readFile(f){
  if(!f.type.startsWith('image/')){ toast('Choose a JPG or PNG image'); return; }
  if(f.size > 5 * 1024 * 1024){ toast('Files must be 5 MB or smaller'); return; }
  const fr = new FileReader();
  fr.onload = () => { const im = new Image(); im.onload = () => {
    const dims = [`${im.naturalWidth} × ${im.naturalHeight}`];
    if(state.mmPending){ state.mmPending = false; const d = addDesign({name:f.name, kind:'image', img:fr.result, fit:'fill', zoom:100, dims}); state.sheet = {type:'mm2', id:d.id, k:firstLoc(d)}; render(); toast('Saved to My Library'); return; }
    startUpload(fr.result, f.name, dims);
  }; im.src = fr.result; };
  fr.readAsDataURL(f);
}
function startUpload(img, name, dims){
  state.sheet = null;
  go({name:'uploading', img});
  runLive(550, () => {
    const d = addDesign({name, kind:'image', img, fit:'fill', zoom:100, dims});
    go({name:'hub'}); openPanel(d.id); toast('Saved to My Library');
  });
}

document.addEventListener('click', e => {
  if(e.target.closest('#statepick')) return;
  if(state.addMenu && !e.target.closest('.split, .newwrap')){ state.addMenu = false; render(); }
  const t = e.target.closest('[data-act]'); if(!t) return;
  const a = t.dataset.act, r = state.route;
  switch(a){
    case 'home': location.href = 'dashboard.html'; break;
    case 'campaigns': location.href = 'campaign-overview.html'; break;
    case 'hub': state.panel = null; closing = false; go({name:'hub'}); break;
    case 'dismissDash': state.dashOff = true; render(); toast('Hidden'); break;
    case 'panelClose': if(e.target === t) closePanel(); break;
    case 'panelSec': state.panel.open[t.dataset.k] = !state.panel.open[t.dataset.k]; renderOverlay(); break;
    case 'panelSel': state.panel.sel = +t.dataset.n; renderOverlay(); break;
    case 'panelRename': state.panel.renaming = true; renderOverlay(); break;
    case 'panelRenameCancel': state.panel.renaming = false; renderOverlay(); break;
    case 'panelRenameSave': savePanelName(); break;
    case 'panelDelete': openSheet({type:'more', id:state.panel.id, confirm:true}); break;
    case 'panelReplace': $('#file').click(); break;
    case 'panelAddDim': toast('Adding a dimension isn’t part of this prototype'); break;
    case 'addMenu': state.addMenu = !state.addMenu; render(); break;
    case 'addUrl': state.addMenu = false; render(); openSheet({type:'addUrl'}); break;
    case 'addShopify': state.addMenu = false; render(); openSheet({type:'addShopify'}); break;
    case 'addCanva': state.addMenu = false; render(); openSheet({type:'addCanva'}); break;
    case 'connect': state.conn[t.dataset.src] = true; state.sheet.sel = []; renderOverlay(); toast(`${t.dataset.src === 'shopify' ? 'Shopify' : 'Canva'} connected`); break;
    case 'pickImport': { const i = +t.dataset.i, sel = state.sheet.sel || []; state.sheet.sel = sel.includes(i) ? sel.filter(x => x !== i) : [...sel, i]; renderOverlay(); break; }
    case 'doImport': { const src = state.sheet.type === 'addShopify' ? 'Shopify' : 'Canva', items = src === 'Shopify' ? SHOPIFY_ITEMS : CANVA_ITEMS, sel = state.sheet.sel || [];
      if(!sel.length){ toast('Pick at least one item'); break; }
      sel.forEach(i => addDesign({...items[i], dims:[...items[i].dims], usedIn:[]}));
      state.sheet = null; go({name:'hub'}); toast(`Added ${sel.length} from ${src}`); break; }
    case 'nav': closeSheet(() => toast('That page isn’t part of this prototype')); break;
    case 'menu': openSheet({type:'menu'}); break;
    case 'close': if(state.sheet?.back){ state.sheet = state.sheet.back; renderOverlay(); } else closeSheet(); break;
    case 'make': toast('Opens Billboard Maker'); break;
    case 'upload': state.mmPending = false; $('#file').click(); break;
    case 'designhelp': toast('Opens the design service request'); break;
    case 'canvaTemplates': toast('Opens Canva billboard templates in a new tab'); break;
    case 'view': state.view = t.dataset.v; state.fx = 'list'; render(); break;
    case 'sortDir': state.dir = state.dir === 'asc' ? 'desc' : 'asc'; state.fx = 'list'; render(); break;
    case 'clearFilters': state.filter = 'all'; state.q = ''; state.dim = ''; state.fx = 'list'; render(); break;
    case 'dismissBanner': state.bannerOff = true; render(); toast(GEN() ? 'Hidden. Generate stays in the header.' : 'Hidden. Mockups are on each creative’s page.'); break;
    case 'dismissMaker': state.makerOff = true; render(); toast('Hidden'); break;
    case 'mockStart': openSheet({type:'mm1'}); break;
    case 'mmBack': state.sheet = {type:'mm1'}; renderOverlay(); break;
    case 'mmNext': { const sh = state.sheet, d = getD(sh.id), k = sh.k || firstLoc(d); state.sheet = {type:'mm3', id:d.id, k}; renderOverlay(); break; }
    case 'mmScenes': state.sheet = {type:'mm2', id:state.sheet.id, k:state.sheet.k}; renderOverlay(); break;
    case 'mmUpload': state.mmPending = true; $('#file').click(); break;
    case 'mockGo': { state.panel = null; const d = getD(t.dataset.id); state.sheet = {type:'mm2', id:d.id, k:firstLoc(d)}; renderOverlay(); break; }
    case 'loc': { const tg = state.sheet?.type === 'mm2' ? state.sheet : state.route; tg.k = t.dataset.k; if(tg === state.sheet) renderOverlay(); else render(); animScene(); break; }
    case 'emailMe': toast('Sent to your inbox'); break;
    case 'filter': state.filter = t.dataset.f; state.fx = 'list'; render(); break;
    case 'open': openPanel(t.dataset.id); break;
    case 'share': { const inMM = /^mm/.test(state.sheet?.type || ''), src = inMM ? state.sheet : r; openSheet({type:'share', id:src.id, k:src.k, back: inMM ? {...state.sheet} : null}); break; }
    case 'download': { const msg = isM() ? 'Saved to your photos' : 'Downloaded billboard-mockup.jpg'; if(state.sheet?.type === 'mm3'){ toast(msg); break; } if(state.sheet?.back){ state.sheet = state.sheet.back; renderOverlay(); toast(msg); break; } closeSheet(() => toast(msg)); break; }
    case 'rename': openSheet({type:'rename', id:state.sheet.id}); { const i = $('#newname'); i && i.select(); } break;
    case 'duplicate': { const d = getD(state.sheet.id); addDesign({...d, name: d.name + ' copy', usedIn:[]}); go({name:'hub'}); toast('Duplicated'); break; }
    case 'deleteAsk': state.sheet.confirm = true; renderOverlay(); break;
    case 'deleteYes': { const id = state.sheet.id, n = getD(id).name; state.designs = state.designs.filter(d=>d.id!==id); if(!state.designs.length) state.lib = 'empty'; state.panel = null; go({name:'hub'}); toast(`Deleted ${n}`); break; }
    case 'copyLink': { const url = 'https://marketplace.blipbillboards.com/p/brk-7Q2X'; const done = () => { if(state.sheet?.back){ state.sheet = state.sheet.back; renderOverlay(); toast('Link copied'); } else closeSheet(() => toast('Link copied')); };
      try{ navigator.clipboard.writeText(url).then(done, done); }catch(err){ done(); } break; }
    case 'shareTo': closeSheet(() => toast(isM() ? 'Opens your phone’s share menu' : 'Opens the social share options')); break;
    case 'startCampaign': { const d = getD(t.dataset.id), from = state.sheet && /^mm/.test(state.sheet.type) ? 'mockup' : 'creative'; state.sheet = null;
      state.panel = null; go({name:'campaignNew', id:d.id, from, back:{name:'hub'}}); toast(`${d.name} added to a new campaign`); break; }
    case 'ccBack': go(state.route.back || {name:'hub'}); break;
    case 'ccNext': toast('The rest of campaign creation isn’t part of this prototype'); break;
  }
});
$('#file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if(f) readFile(f); else state.mmPending = false; });

/* Keyboard: Esc closes or backs out, arrows flip scenes */
document.addEventListener('keydown', e => {
  if(e.target.id === 'panelName'){ if(e.key === 'Enter') savePanelName(); if(e.key === 'Escape'){ state.panel.renaming = false; renderOverlay(); } return; }
  if(e.target.closest('input, textarea, select')) { if(e.key === 'Escape' && state.sheet) closeSheet(); return; }
  const r = state.route;
  if(e.key === 'Escape'){ if(state.sheet) closeSheet(); else if(state.panel) closePanel(); }
  if((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && state.sheet?.type === 'mm2') stepScene(e.key === 'ArrowRight' ? 1 : -1);
});

document.addEventListener('input', e => { if(e.target.id === 'panelName') $('#panelCount').textContent = `${e.target.value.length} / 100`; });

/* Drag a file anywhere onto the library to upload it */
let dragDepth = 0;
const canDrop = () => state.route.name === 'hub' && !state.sheet;
const showDZ = on => { $('#dz').hidden = !on; };
document.addEventListener('dragenter', e => { if(!e.dataTransfer || ![...e.dataTransfer.types].includes('Files') || !canDrop()) return; e.preventDefault(); dragDepth++; showDZ(true); });
document.addEventListener('dragover', e => { if(dragDepth > 0) e.preventDefault(); });
document.addEventListener('dragleave', () => { if(dragDepth > 0 && --dragDepth === 0) showDZ(false); });
document.addEventListener('drop', e => { if(dragDepth === 0) return; e.preventDefault(); dragDepth = 0; showDZ(false); const f = e.dataTransfer.files[0]; if(f) readFile(f); });

/* Re-lay out live when the window crosses the compact breakpoint */
MQ.addEventListener('change', e => { state.compact = e.matches; if(state.sheet?.type === 'menu' && !e.matches) state.sheet = null; render(); });

jump(START, 'full');
})();
</script>

</body></html>
