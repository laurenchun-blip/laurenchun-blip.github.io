<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discover Locations Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #ececec; --ink: #1c1c1a; --muted: #6b6a64; --accent: #b80067; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: Inter, system-ui, sans-serif; color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header p { margin: 0; font-size: 12px; color: var(--muted); flex: 1; min-width: 200px; }
  .seg { display: flex; border: 1px solid #cecece; border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: #fff; color: var(--accent); font: 700 12px Inter; padding: 6px 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  header a { font-size: 12px; color: var(--accent); }
  main { flex: 1; min-height: 0; display: flex; gap: 32px; justify-content: center; align-items: flex-start; padding: 20px; overflow: auto; }
  .device { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .device span { font-size: 11px; color: var(--muted); }
  .frame { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.12); position: relative; }
  .frame iframe { border: 0; display: block; transform-origin: 0 0; }
  .phone { border-radius: 36px; border: 10px solid #111; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Discover Locations</h1>
  <p>Figma 678:5318 + mocks 678:7570 · MapLibre with live Blip sign inventory</p>
  <div class="seg" role="group" aria-label="Viewport">
    <button type="button" data-v="both" aria-pressed="true">Both</button>
    <button type="button" data-v="desktop" aria-pressed="false">Desktop</button>
    <button type="button" data-v="mobile" aria-pressed="false">Mobile</button>
  </div>
  <a href="discover-locations.html" target="_blank" rel="noopener">Open full page ↗</a>
</header>
<main id="stage">
  <div class="device" id="desk"><div class="frame" id="desk-frame"><iframe id="desk-if" src="discover-locations.html" title="Desktop 1440" width="1440" height="1000"></iframe></div><span>Desktop · 1440</span></div>
  <div class="device" id="mob"><div class="frame phone"><iframe src="discover-locations.html" title="Mobile 390" width="390" height="780"></iframe></div><span>Mobile · 390</span></div>
</main>
<script>
  const stage = document.getElementById('stage');
  let view = 'both';
  function fit() {
    const avail = stage.clientWidth - 40 - (view === 'both' ? 410 + 32 : 0);
    const h = stage.clientHeight - 60;
    const s = Math.min(1, avail / 1440, h / 1000);
    const f = document.getElementById('desk-frame');
    document.getElementById('desk-if').style.transform = `scale(${s})`;
    f.style.width = 1440 * s + 'px'; f.style.height = 1000 * s + 'px';
  }
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    view = b.dataset.v;
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    document.getElementById('desk').hidden = view === 'mobile';
    document.getElementById('mob').hidden = view === 'desktop';
    fit();
  }));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
