<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campaign Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
<style>
/* Campaign overview, option A: the Campaigns list (as shipped: tabs, two-column cards, status, last 7 days, alert footers)
   and a peek drawer that answers, in order: is it running, how is it doing, what does it look like, where/when/how much.
   Footer actions are Edit + Copy link (no full details page); the mockup has its own Share mockup (email, a sub-view inside the drawer) + Download mockups; Pause/Start live in the ⋮ menu and on the cards. Phones get the drawer as a full-screen view with a collapsible Details section.
   Light only, like the product. */
:root{
  color-scheme:light;
  --page:#f2f2f2; --surface:#ffffff; --surface-2:#f7f7f7; --surface-3:#ededed;
  --text:#161616; --text-2:#5c5c5c; --text-3:#8f8f8f;
  --border:#e3e3e3; --border-2:#d1d1d1;
  --accent:#176BF5; --accent-2:#0f4fba; --accent-bg:#eaf1fe; --accent-border:#bcd5fb;
  --success:#0f7a54; --success-bg:#e6f4ee;
  --warn:#8a5a00; --warn-bg:#fdf1dc; --warn-border:#f2d49b;
  --danger:#b42318; --danger-bg:#fdecea; --danger-border:#f5c2bc;
  --brand:#e3122b; --org:#7b4bd6; --teal:#1f6f7a;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-md:6px; --r-lg:8px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Product chrome ---------- */
.ptop{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:16px;height:60px;padding:0 20px 0 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.wordmark{display:inline-flex;align-items:center;height:36px;padding:0 9px 2px;border-radius:4px;background:var(--brand);color:#fff;font-size:27px;font-weight:600;letter-spacing:-.05em;line-height:1;text-decoration:none}
.ptop .sp{flex:1}
.phelp{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r-md)}
.phelp:hover{background:var(--surface-2)}
.phelp .icon{width:24px;height:24px}
.pav{width:36px;height:36px;border-radius:50%;background:var(--org);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600}
.pbody{display:grid;grid-template-columns:68px minmax(0,1fr);min-height:calc(100dvh - 60px)}
.prail{position:sticky;top:60px;height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;background:var(--surface);border-right:1px solid var(--border)}
.porg{width:40px;height:40px;border-radius:8px;background:var(--org);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:600;margin-bottom:6px}
.pnav{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;border:2px solid transparent;text-decoration:none}
.pnav .icon{width:24px;height:24px;stroke-width:1.7}
.pnav:hover{background:var(--surface-2)}
.pnav[aria-current="page"]{border-color:var(--accent);background:var(--surface-2)}
main{padding:28px clamp(16px,3.5vw,48px) 96px;min-width:0;max-width:1200px}

/* ---------- Campaigns list ---------- */
.head{display:flex;flex-direction:column;gap:16px;margin-bottom:20px;max-width:1072px}
.head h1{font-size:24px;font-weight:600;letter-spacing:-.01em}
.head-acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:var(--r-md);font-size:14px;font-weight:600;white-space:nowrap}
.btn .icon{width:18px;height:18px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.secondary{background:var(--surface);border:1px solid var(--border-2)}
.btn.secondary:hover{background:var(--surface-2)}
.btn.danger{background:var(--danger);color:#fff}
.btn.warn{background:var(--surface);border:1px solid var(--warn-border);color:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border-2)}
.tabs button{padding:8px 12px;font-size:14px;font-weight:500;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent-2);border-bottom-color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:1072px}

.ccard{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-lg);overflow:hidden;text-align:left;transition:box-shadow .15s,border-color .15s;cursor:pointer}
.ccard:hover{border-color:#b9b9b9;box-shadow:0 4px 14px rgba(0,0,0,.07)}
.ccard[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ccard .inner{display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px}
.ccard .thumb{margin:12px 14px 0;border-radius:var(--r-md);overflow:hidden;aspect-ratio:3.5/1}
.crow{display:flex;align-items:center;gap:8px}
.crow .sp{flex:1}
.tag-opt{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;background:var(--teal);color:#fff;font-size:11px;font-weight:600}
.cact{display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:6px;font-size:13px;font-weight:600;color:var(--accent-2)}
.cact:hover,.ciconb:hover{background:var(--surface-2)}
.cact .icon{width:14px;height:14px}
.ciconb{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--text-2)}
.ciconb .icon{width:16px;height:16px}
.cname{font-size:15px;font-weight:600}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--text-3)}
.status.running i{background:var(--success)} .status.running{color:var(--success)}
.status.stopped i{background:var(--danger)} .status.stopped{color:var(--danger)}
.status.review i{background:#d08700} .status.review{color:var(--warn)}
.cstats{border-top:1px solid var(--border);padding-top:10px;margin-top:2px}
.cstats .lbl{font-size:12px;color:var(--text-3);font-weight:500}
.cstats .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.cstats b{display:block;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.cstats span{font-size:12px;color:var(--text-2)}
.cstats .wait{font-size:12px;color:var(--text-3);margin-top:6px}
.nums.dash b,.kpis.dash b{color:var(--text-3)}
.cfoot{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13px;font-weight:600;border-top:1px solid}
.cfoot .sp{flex:1}
.cfoot.error{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}
.cfoot.warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn)}
.cfoot .icon{width:16px;height:16px}
.head-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head-l{display:flex;flex-direction:column;gap:16px}
.lctl{display:flex;align-items:center;gap:8px}
.viewbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:var(--r-md);font-size:14px;font-weight:500}
.viewbtn:hover{background:var(--surface-3)}
.viewbtn .icon{width:18px;height:18px}
.search{position:relative;display:block}
.search>.icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-2);pointer-events:none}
.search input{width:260px;height:38px;padding:0 34px 0 36px;border:1px solid var(--border-2);border-radius:var(--r-md);background:var(--surface);font:inherit;font-size:14px;color:var(--text)}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--text-3)}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.qx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;display:grid;place-items:center;border-radius:50%;color:var(--text-2)}
.qx:hover{background:var(--surface-2)}
.qx .icon{width:15px;height:15px}
.empty b{display:block;color:var(--text);font-weight:600}
.empty p{margin-top:6px}
.empty .btn{margin-top:14px}
/* Table view */
.tbl-wrap{max-width:1072px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-lg);overflow:auto}
.ctbl{width:100%;border-collapse:collapse;font-size:13.5px}
.ctbl th{padding:8px 10px;text-align:left;font-size:12px;font-weight:600;color:var(--text-2);background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
.ctbl th.grp{text-align:center;padding-bottom:2px;border-bottom:0;color:var(--text-3)}
.ctbl thead tr:first-child th[rowspan]{vertical-align:bottom}
.ctbl td{padding:10px;border-top:1px solid var(--border);vertical-align:middle}
.ctbl tbody tr:first-child td{border-top:0}
.ctbl .num{text-align:right;font-variant-numeric:tabular-nums}
.ctbl td.num{font-weight:600}
.ctbl .dash{color:var(--text-3);font-weight:500}
.trow{cursor:pointer}
.trow:hover td{background:var(--surface-2)}
.trow[aria-current="true"] td{background:var(--accent-bg)}
.tname{display:flex;align-items:center;gap:10px;min-width:190px}
.tname>div{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.tname b{font-weight:600}
.tthumb{flex:none;width:64px;aspect-ratio:3.5/1;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--border)}
.tthumb .cre-empty{border:0}
.ctbl td.when{white-space:nowrap}
.ctbl td.when small{white-space:normal;min-width:110px}
.ctbl td.when small{display:block;font-size:12px;color:var(--text-2)}
.talert{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:12.5px;font-weight:600;text-align:left}
.ctbl td.tstat{min-width:170px}
.ctbl td.tstat .status{white-space:nowrap}
button.talert:hover{text-decoration:underline}
.talert .icon{width:14px;height:14px}
.talert.error{color:var(--danger)} .talert.warn{color:var(--warn)}
.tacts>div{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.ctbl td.tprim{width:1%;white-space:nowrap;padding-left:8px;padding-right:4px}
.ctbl td.tmod{white-space:nowrap}
.ctbl td.tmod .mword{display:block;font-size:13.5px}
.ctbl td.tmod small{display:block;font-size:12px;color:var(--text-2)}
.ctbl td.tacts{width:1%}
.cact.bad{color:var(--danger)}
/* Status sections: a heading row that collapses its group, in both views */
.lsec{max-width:1072px}
.lsec+.lsec{margin-top:28px}
.lsec-h{margin:0 0 12px}
.lsec-b{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:2px 0}
.lsec-b .icon{width:16px;height:16px;color:var(--text-2);transition:transform .15s}
.lsec-b[aria-expanded="false"] .icon{transform:rotate(-90deg)}
.lsec-b .tt{font-size:15px;font-weight:600;color:var(--text)}
.lsec-b .cnt{min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--surface-3);font-size:12px;font-weight:600;color:var(--text-2);display:grid;place-items:center}
.lsec.attention .cnt,.gsec.attention .cnt{background:var(--danger-bg);color:var(--danger)}
.lsec-b .hint{font-size:12.5px;color:var(--text-3);font-weight:400}
.ctbl .ghead th{padding:14px 12px 8px;background:var(--surface);border-bottom:1px solid var(--border);border-top:1px solid var(--border-2)}
.ctbl .gsec:first-of-type .ghead th{border-top:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.empty{padding:40px;text-align:center;color:var(--text-2);background:var(--surface);border:1px dashed var(--border-2);border-radius:var(--r-lg);max-width:1072px}

/* ---------- Creative (shared by card thumbs, drawer rows and the mockup face) ---------- */
.thumb,.crow2 .t{container-type:size}
.cre{position:relative;width:100%;height:100%;display:flex;align-items:center;gap:4cqw;padding:0 5cqw 6cqh;background:var(--cbg);color:var(--cfg);overflow:hidden}
.cre b{flex:1;font-weight:800;font-size:min(21cqh,5.4cqw);line-height:1.05;letter-spacing:-.02em}
.cre small{position:absolute;left:5cqw;bottom:9cqh;font-size:min(7cqh,2.2cqw);font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.cre .logo{flex:none;width:min(54cqh,18cqw);aspect-ratio:1;border-radius:50%;background:var(--cfg);display:grid;place-items:center}
.cre .logo::after{content:"";width:42%;aspect-ratio:1;border-radius:50%;border:max(2px,4cqh) solid var(--cbg)}

/* ---------- Drawer ---------- */
.veil{position:fixed;top:60px;right:0;bottom:0;left:68px;z-index:40;display:flex;justify-content:flex-end;background:rgba(22,22,22,.42)}
.veil.enter{animation:veilin .22s ease-out}
.veil.enter .drawer{animation:drawin .3s cubic-bezier(.2,.8,.2,1)}
.veil.leave{animation:veilout .2s ease-in forwards;pointer-events:none}
.veil.leave .drawer{animation:drawout .2s ease-in forwards}
@keyframes veilin{from{opacity:0}to{opacity:1}}
@keyframes veilout{from{opacity:1}to{opacity:0}}
@keyframes drawin{from{transform:translateX(100%)}to{transform:none}}
@keyframes drawout{from{transform:none}to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.veil.enter,.veil.enter .drawer,.veil.leave,.veil.leave .drawer{animation:none}}
.drawer{width:520px;max-width:100%;height:100%;display:flex;flex-direction:column;background:var(--surface);box-shadow:-8px 0 28px rgba(0,0,0,.14)}
.dhead{display:flex;align-items:flex-start;gap:10px;padding:18px 16px 14px 20px;border-bottom:1px solid var(--border)}
.dhead .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dhead h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.dback{display:none}
.dx{width:32px;height:32px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--text-2)}
.dx:hover{background:var(--surface-2);color:var(--text)}
.dbody{flex:1;min-height:0;overflow:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.sec-h span{font-size:12px;color:var(--text-3)}

.alert{display:flex;gap:10px;padding:12px 14px;border:1px solid;border-radius:var(--r-lg)}
.alert .icon{width:20px;height:20px;margin-top:1px}
.alert div{display:flex;flex-direction:column;gap:4px;min-width:0}
.alert b{font-size:14px;font-weight:600;color:var(--text)}
.alert p{font-size:13px;color:var(--text-2);line-height:1.45}
.alert .btn{align-self:flex-start;margin-top:6px;padding:7px 12px;font-size:13px}
.alert.error{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}
.alert.warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn)}
.alert.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px rgba(180,35,24,.25)}100%{box-shadow:0 0 0 0 rgba(180,35,24,0)}}

/* Moderation banner (option A): states the problem and holds the fix. White with a red outline and icon (no red fill),
   so Replace creative is the only strong color. The Moderation card below reports the same state, without a button. */
.mbanner{display:flex;gap:10px;padding:12px 14px;border:1px solid var(--danger-border);border-radius:var(--r-lg);background:var(--surface);color:var(--danger)}
.mbanner.flash{animation:flash 1.2s ease-out}
.mbanner .icon{width:20px;height:20px;margin-top:1px}
.mbanner>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mbanner b{font-size:14.5px;font-weight:600;color:var(--text)}
.mbanner p{font-size:13px;color:var(--text-2)}
.mbanner .acts{display:flex;align-items:center;gap:14px;margin-top:8px}
.mbanner .btn{padding:7px 12px;font-size:13px}
/* Severity: Blocking = red outline + primary CTA (the campaign can't run); Warning = amber outline + secondary CTA (it still runs) */
.mbanner.warn{border-color:var(--warn-border);color:#b25e00}
.mbanner .btn.secondary{color:var(--text)}
.ctag.none{background:var(--surface-3);color:var(--text-2)}

/* Moderation (look A): the status pill is the headline, with the board count beside it and "See details" on the same line.
   Only a rejection that blocks delivery adds a light red band and the Replace action. Moderation only: no budget wording. */
.mod{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;scroll-margin-top:12px}
.mod.flash{animation:flash 1.2s ease-out}
.mod-top{display:flex;flex-direction:column;gap:6px;padding:12px 14px}
.mod-hl{display:flex;align-items:center;gap:10px;min-width:0}
.mod-hl .linkbtn{font-size:14px;line-height:20px}
.mod-hl .ln{flex:1;min-width:0;font-size:14px;line-height:20px;color:var(--text-2)}
.mod-hl .nw{white-space:nowrap}
.mod-top .why{font-size:13px;color:var(--text-2)}
.mod-top .btn{align-self:flex-start;margin-top:4px;padding:7px 12px;font-size:13px}
.mword{flex:none;font-size:14px;line-height:20px;font-weight:600}
.mword.ok{color:var(--success)} .mword.review{color:var(--warn)} .mword.fix{color:var(--danger)} .mword.none{color:var(--text-2)}
/* Per-dimension status uses small chips: in a list they scan faster than text. The summary line above stays text. */
.mod-row .tags{gap:4px}
.linkbtn{flex:none;font-size:13px;font-weight:600;color:var(--accent-2);white-space:nowrap}
.linkbtn:hover{text-decoration:underline}
.mod-tg{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;border-top:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text-2);text-align:left}
.mod-tg:hover{background:var(--surface-2)}
.mod-tg span{flex:1}
.mod-tg .icon{width:16px;height:16px;transition:transform .15s}
.mod-tg[aria-expanded="true"] .icon{transform:rotate(180deg)}
.mod-list{border-top:1px solid var(--border);padding:2px 14px 6px}
.mod-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:13.5px}
.mod-row:first-child{border-top:0}
.mod-row>div{flex:1;min-width:0;display:flex;flex-direction:column}
.mod-row b{font-weight:600;font-variant-numeric:tabular-nums}
.mod-row small{font-size:12.5px;color:var(--text-2)}
.mod-row .tags{display:flex;flex-wrap:wrap;justify-content:flex-end}
/* Draft drawer: a setup checklist in the editor's order, then the mockup. Missing steps say so and link to that step. */
.status.draft i{background:var(--text-3)}
.setup-note{font-size:12.5px;color:var(--text-2)}
.fact .missing{color:var(--text-3);font-weight:500}
.fact .chk{display:inline-flex;align-items:center;gap:6px}
.fact .chk .icon{width:16px;height:16px;color:var(--success)}
.fact .row{display:flex;align-items:center;gap:10px}
.fact .row>span{flex:1}
/* Draft with no creative: the mockup's spot keeps its size and shows an empty billboard that asks for a creative */
.mock-empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 16px 16px;border-radius:var(--r-lg);border:1px dashed var(--border-2);background:var(--surface-2);text-align:center}
.mock-empty .bb{position:relative;width:96px;aspect-ratio:3.5/1;margin-bottom:14px;border:1.5px dashed #b8c1cc;border-radius:3px;background:var(--surface)}
.mock-empty .bb::after{content:"";position:absolute;left:50%;top:100%;width:3px;height:10px;margin-top:1px;transform:translateX(-50%);background:#c3cad3}
.mock-empty .mt{display:flex;flex-direction:column;align-items:center;gap:2px}
.mock-empty b{font-size:14px;font-weight:600}
.mock-empty p{font-size:13px;color:var(--text-2)}
.mock-empty .add{margin-top:6px;font-size:13.5px;font-weight:600;color:var(--accent-2);text-decoration:underline;text-underline-offset:3px}
.thumb .cre-empty{width:100%;height:100%;display:grid;place-items:center;background:var(--surface-2);border:1px dashed var(--border-2);border-radius:inherit;color:var(--text-3);font-size:13px;font-weight:600}
/* Details › Creative: one thumbnail, the rest lives in the editor */
.cr1{display:flex;gap:12px;align-items:center}
.cr1 .t{flex:none;width:132px;aspect-ratio:3.5/1;border-radius:5px;overflow:hidden;box-shadow:0 0 0 1px var(--border);container-type:size}
.cr1>div{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.cr1 small{margin-top:0}
/* Keep the Details text styles off the creative art inside the thumbnail */
.cr1 .t .cre b{font-size:min(21cqh,5.4cqw);font-weight:800}
.cr1 .t .cre small{display:block;position:absolute;margin:0;color:inherit;font-size:min(7cqh,2.2cqw)}
.cr1 .linkbtn{margin-top:3px}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:12px;color:var(--text-2);font-weight:500}
.nodata{font-size:12.5px;color:var(--text-3)}
.kpi b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.mock{position:relative;border-radius:var(--r-lg);overflow:hidden;background:#cfe2f3}
.mock img{display:block;width:100%;height:auto}
.mock .ex{position:absolute;right:10px;bottom:10px;padding:3px 8px;border-radius:999px;background:rgba(17,24,39,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;font-size:11px;font-weight:500}
.mock .ex.mwb{background:rgba(255,255,255,.92);color:var(--text);font-weight:600;-webkit-backdrop-filter:none;backdrop-filter:none}
.mock .ex.mwb i{display:inline-block;margin-right:4px;padding:0 4px;border-radius:3px;background:var(--brand);color:#fff;font-style:normal;font-size:10px;letter-spacing:-.02em}
.mock-acts{position:relative;display:flex;align-items:center;gap:8px}
/* Mockup actions are labeled and scoped to the mockup ("Share mockup" / "Download mockups"); the footer is for the whole campaign */
.mock-acts .btn{flex:1}
/* Share sub-view: pushes inside the drawer on every device (no modal over the drawer) */
.dhead .dback.sv{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 6px 0 2px;margin:-4px 0 4px -6px;border-radius:var(--r-md);font-size:14px;font-weight:600;color:var(--accent-2)}
.dhead.sub{flex-wrap:wrap}
.dhead.sub .tt{flex-basis:calc(100% - 42px);order:3}
.dhead.sub .tt p{font-size:13px;color:var(--text-2)}
.dhead.sub .sp{flex:1}
.sv-f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.sv-f small{font-weight:400;color:var(--text-2)}
.to{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;min-height:42px;border:1px solid var(--border-2);border-radius:var(--r-md);cursor:text}
.to:focus-within{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.to.bad{border-color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:2px;height:26px;padding:0 2px 0 9px;border-radius:999px;background:var(--surface-3);font-size:13px;font-weight:500}
.chip.me{background:var(--accent-bg);color:var(--accent-2)}
.chip button{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;color:var(--text-2)}
.chip button:hover{background:rgba(0,0,0,.06)}
.chip .icon{width:13px;height:13px}
.to input{flex:1;min-width:140px;border:0;outline:0;font:inherit;font-size:14px;padding:4px;background:none;color:var(--text)}
.sv-hint{font-size:12.5px;font-weight:400;color:var(--danger)}
.sv textarea{font:inherit;font-size:14px;font-weight:400;padding:9px 11px;border:1px solid var(--border-2);border-radius:var(--r-md);resize:none;color:var(--text)}
.sv textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.files{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-lg)}
.file{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--border);font-weight:400}
.file:first-child{border-top:0}
.file .mock{border-radius:4px}
.file .mock .ex{right:3px;bottom:3px;padding:1px 4px;font-size:6.5px}
.file .mock .ex.mwb i{font-size:6px;padding:0 2px;margin-right:2px}
.file .sq{width:52px;aspect-ratio:1;justify-self:start}
/* Social square = the Billboard Maker marketing look: an illustrated sky-and-grass scene, the creative on a framed
   board with two legs, and a dark "Made with [Blip logo]" pill bottom-right. Sized in cqw so it scales to any size. */
.soc{container-type:inline-size;border-radius:4px;overflow:hidden}
.soc-in{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;padding:24cqw 9cqw 0;background:linear-gradient(180deg,#8FB6D6 0%,#BFD6E6 46%,#A9BE97 46%,#8CA37A 100%)}
.soc-board{width:100%;display:flex;flex-direction:column;align-items:center}
.soc-board .t{display:block;width:100%;aspect-ratio:3.5/1;border:1.3cqw solid #71808C;border-radius:.7cqw;box-shadow:0 2.4cqw 6cqw rgba(20,32,44,.3);overflow:hidden;container-type:size}
.soc-legs{display:flex;gap:34%;width:46%}
.soc-legs span{flex:1;height:13cqw;background:linear-gradient(90deg,#65727D,#7C8A96)}
.soc-mark{position:absolute;right:3.5cqw;bottom:3.5cqw;display:inline-flex;align-items:center;gap:1.2cqw;padding:1.8cqw 3cqw;border-radius:999px;background:rgba(20,32,44,.42);color:#fff;font-size:4.2cqw;font-weight:600;letter-spacing:.02em;line-height:1;white-space:nowrap;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.soc-mark svg{display:block;height:1.05em;width:auto}
.file.soc-row{grid-template-columns:120px minmax(0,1fr)}
.file .soc{width:120px}
/* Keep the file list text styles off the creative art inside the scene */
.file .soc .cre b{display:block;flex:1;font-size:min(21cqh,5.4cqw);font-weight:800;line-height:1.05;word-break:normal}
.file .soc .cre small{display:block;position:absolute;margin:0;color:inherit;font-size:min(7cqh,2.2cqw)}
.file .sq .ex.mwb{font-size:0;padding:1px}
.file .sq .ex.mwb i{margin:0}
.file .sq img{width:100%;height:100%;object-fit:cover}
.file .doc{width:88px;aspect-ratio:2.7/1;border-radius:4px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-2)}
.file b{display:block;font-size:13.5px;font-weight:600;word-break:break-all}
.file small{display:block;font-size:12.5px;color:var(--text-2);margin-top:1px}
.mock-acts .cap,.sec .cap{flex:1;font-size:12.5px;color:var(--text-2)}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--border-2);border-radius:var(--r-md);color:var(--text)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn .icon{width:18px;height:18px}

.nextcard{padding:14px 16px;border:1px solid var(--accent-border);border-radius:var(--r-lg);background:var(--accent-bg);display:flex;flex-direction:column;gap:12px}
.nextcard h3{font-size:14.5px;font-weight:600;color:var(--accent-2)}
.nextcard .next li::before{background:var(--surface);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--accent-border)}
.nextcard .next li.now::before{background:var(--accent);color:#fff;box-shadow:none}
.next{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:n}
.next li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;font-size:13.5px;color:var(--text-2)}
.next li::before{counter-increment:n;content:counter(n);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface-3);color:var(--text-2)}
.next li.now::before{background:var(--accent);color:#fff}
.next b{color:var(--text);font-weight:600;display:block}

.facts{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-lg)}
.fact{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:11px 14px;border-top:1px solid var(--border);font-size:13.5px}
.fact:first-child{border-top:0}
.fact>span:first-child{color:var(--text-2);font-weight:500}
.fact b{font-weight:600}
.fact small{display:block;color:var(--text-2);font-size:12.5px;margin-top:2px}
.crows{display:flex;flex-direction:column;gap:14px}
.crow2{display:flex;flex-direction:column;gap:6px}
.crow2 .t{display:block;width:100%;aspect-ratio:3.5/1;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--border)}
.cmeta{display:flex;align-items:center;gap:8px}
.cmeta b{flex:1;font-size:13.5px;font-weight:600;min-width:0}
.ctag{font-size:12px;font-weight:600;padding:2px 7px;border-radius:4px}
.ctag.ok{background:var(--success-bg);color:var(--success)}
.ctag.bad{background:var(--danger-bg);color:var(--danger)}
.ctag.wait{background:var(--warn-bg);color:var(--warn)}
.dfoot{display:flex;align-items:center;gap:8px;padding:12px 16px 12px 20px;border-top:1px solid var(--border);background:var(--surface)}
.dfoot .sp{flex:1}
.menu{position:absolute;right:52px;top:52px;z-index:5;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-md);font-size:14px;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu .icon{width:17px;height:17px;color:var(--text-2)}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;max-width:calc(100vw - 32px);background:#232a33;color:#fafafa;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* ---------- Step picker (same as the other Mockup Placements prototypes) ---------- */
.statepick{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:75;color:#fafafa;font-size:13px}
.statepick .icon{width:16px;height:16px}
.sp-body{display:flex;align-items:center;gap:6px;background:#232a33;border-radius:999px;padding:4px 6px 4px 14px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.sp-lbl{color:#9aa3b2;white-space:nowrap;font-size:12px}
.statepick select{background:transparent;color:inherit;border:0;font:inherit;font-weight:600;max-width:300px;cursor:pointer;padding:5px 2px}
.statepick select option,.statepick select optgroup{color:#161616;background:#fff}
.sp-div{width:1px;height:18px;background:#3d4552;margin:0 6px}
.sp-hub{color:#fafafa;font-weight:600;text-decoration:none;white-space:nowrap;padding:4px 6px;border-radius:6px}
.sp-hub:hover,.sp-nav button:hover{background:#3a4350}
.sp-nav{display:flex;gap:2px}
.sp-nav button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fafafa}
.sp-nav button:disabled{opacity:.35;cursor:default;background:none}

/* Details: a plain section on desktop; on phones a collapsible row with a summary line */
.dt-toggle{display:none}
.menu button[disabled]{opacity:.5;cursor:not-allowed}
.menu small{display:block;font-size:12px;color:var(--text-3);margin-left:4px}
/* ---------- Phones: one column; the drawer becomes a full-screen view ---------- */
@media (max-width:767px){
  .ptop{height:56px;padding:0 16px}
  .wordmark{height:32px;font-size:24px}
  .pbody{grid-template-columns:1fr}
  .prail{display:none}
  main{padding:20px 16px 96px}
  .head h1{font-size:20px}
  .lctl{width:100%}
  .lctl .viewbtn{display:none}
  .search{flex:1}
  .search input{width:100%}
  .grid{grid-template-columns:1fr}
  .veil{top:0;left:0;z-index:60;background:transparent}
  .drawer{width:100%;box-shadow:none}
  .dhead{position:sticky;top:0;padding:10px 12px 12px 8px;flex-wrap:wrap}
  .dback{display:inline-flex;align-items:center;gap:2px;height:36px;padding:0 6px;border-radius:var(--r-md);font-size:15px;font-weight:600;color:var(--accent-2)}
  .dhead .tt{flex-basis:100%;order:3;padding-left:8px}
  .dhead .dx{display:none}
  .dhead .sp{flex:1}
  .dbody{padding:14px 16px 24px}
  .fact{grid-template-columns:84px minmax(0,1fr)}
  .dfoot{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .dfoot .btn{flex:1 1 0;min-width:0;padding:9px 10px}
  .dfoot .sp{display:none}
  /* Details on phones (Option A): DETAILS header like Moderation, then a card whose summary row opens the rows */
  .dt-toggle{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-lg);text-align:left}
  .dt-toggle .dt-sum{flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:600}
  .dt-toggle .dt-sum.unset{color:var(--text-2)}
  .dt-toggle .icon{width:16px;height:16px;color:var(--text-2);transition:transform .15s}
  .details.open .dt-toggle{border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom:0}
  .details.open .dt-toggle .icon{transform:rotate(180deg)}
  .details .facts{display:none}
  .details.open .facts{display:flex;border-radius:0 0 var(--r-lg) var(--r-lg);margin-top:-10px}
  .menu{right:12px;top:52px}
  .statepick{left:auto;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .sp-body{flex-wrap:wrap;border-radius:14px;max-width:calc(100vw - 24px)}
  .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  .dhead.sub .dback.sv{font-size:15px;margin-left:0}
  .dhead.sub .dx{display:none}
  .dhead.sub .tt{flex-basis:100%;padding-left:8px}
}
</style>
</head>

/* ---------- Campaigns list (option B) ----------
   One list in status sections, in the order a person acts on them: Needs attention → Drafts → Active → Ended.
   Drafts sit next to live campaigns so they get finished; ended campaigns stay in the list with their results until
   someone archives them (no auto-archive). Archived is its own tab, a flat list. Every section collapses. */
const SECS = [
  ['attention', 'Needs attention', 'Fix these to keep them running'],
  ['drafts', 'Drafts', 'Finish setup to launch'],
  ['active', 'Active', ''],
  ['ended', 'Ended', 'Numbers cover the whole run · stays here until archived']
];
const RUN_ORDER = {running:0, review:1, paused:2, stopped:3};
const secOf = c => c.status === 'draft' ? 'drafts' : c.status === 'ended' ? 'ended' : c.alerts.length ? 'attention' : 'active';
const blocked = c => c.alerts.some(a => a.sev === 'block' || a.kind === 'error');
const wholeRun = c => c.status === 'ended';

/* The row's one action, shared by cards and the table: Pause / Start, Review when an alert stops it,
   Launch or Continue setup for drafts. In review and ended have none. */
function primary(c, inCard){
  if(c.status === 'running') return `<button class="cact" data-act="toggle" data-id="${c.id}">${ic('pause')}Pause</button>`;
  if(c.status === 'paused' || c.status === 'stopped'){
    if(blocked(c)) return inCard ? '' : `<button class="cact bad" data-act="review" data-id="${c.id}">${ic('alert')}Review</button>`;
    return `<button class="cact" data-act="toggle" data-id="${c.id}">${ic('play')}Start</button>`;
  }
  if(c.status === 'draft'){
    const st = c.setup, keys = ['locations','budget','duration','creative'], next = keys.find(k => !st[k]);
    return next ? `<button class="cact" data-act="setupStep" data-step="${next}">${ic('chev')}Continue setup</button>`
      : `<button class="cact" data-act="launch">${ic('play')}Launch</button>`;
  }
  return '';
}

function card(c){
  const lbl = wholeRun(c) ? `Whole run · ${c.runDays} days` : 'Last 7 days';
  const stats = c.imp != null
    ? `<div class="lbl">${lbl}</div><div class="nums"><div><b>${c.imp}</b><span>Impressions</span></div><div><b>${c.spend}</b><span>Spend</span></div><div><b>${c.blips}</b><span>Blips</span></div></div>`
    : `<div class="lbl">Last 7 days</div><div class="nums dash"><div><b>–</b><span>Impressions</span></div><div><b>–</b><span>Spend</span></div><div><b>–</b><span>Blips</span></div></div><p class="wait">${c.status === 'draft' ? 'No data yet. Launch the campaign to start moderation.' : 'No data yet. Numbers start the day after it goes live.'}</p>`;
  const a = c.alerts, foot = !a.length ? '' : a.length === 1 && a[0].kind === 'error'
    ? `<div class="cfoot error">${ic('alert')}${esc(a[0].title)}<span class="sp"></span><button data-act="review" data-id="${c.id}">Review →</button></div>`
    : `<div class="cfoot warn">${ic('warn')}${a.length} alert${a.length>1?'s':''}<span class="sp"></span><button data-act="review" data-id="${c.id}" aria-label="Review alerts">${ic('chev')}</button></div>`;
  return `<article class="ccard" data-act="open" data-id="${c.id}" tabindex="0" role="button" aria-label="${esc(c.name)} details" aria-current="${state.open === c.id}">
    <div class="thumb">${c.cre.length ? creative(c.cre[0]) : '<div class="cre-empty">No creative yet</div>'}</div>
    <div class="inner">
      <div class="crow">${c.opt ? '<span class="tag-opt">Blip optimized</span>' : ''}<span class="sp"></span>${primary(c, true)}
        <button class="ciconb" data-act="edit" data-id="${c.id}" aria-label="Edit ${esc(c.name)}">${ic('pencil')}</button></div>
      <div class="cname">${esc(c.name)}</div>
      <span class="status ${c.status}"><i></i>${c.label}</span>
      <div class="cstats">${stats}</div>
    </div>${foot}</article>`;
}

/* Moderation, overall: the same words as the drawer's Moderation card, with the board count under them */
function modCell(c){
  const m = c.mod;
  if(!m || c.status === 'draft') return `<span class="mword none">Not started</span><small>${c.status === 'draft' ? 'After launch' : ''}</small>`;
  const t = modCounts(m.rows);
  if(m.state === 'review') return `<span class="mword review">In review</span><small>${t.boards} boards</small>`;
  if(m.state === 'fix') return `<span class="mword fix">Rejected</span><small>${t.bad} of ${t.boards} boards</small>`;
  if(m.state === 'none') return `<span class="mword none">Not started</span><small>No creative yet</small>`;
  return `<span class="mword ok">Approved</span><small>${t.ok === t.boards ? `All ${t.boards} boards` : `${t.ok} of ${t.boards} boards`}</small>`;
}

/* Table: columns run from what people act on (left) to what they check now and then (right):
   Action · Campaign · Status · Moderation · Last 7 days · Dates · Edit. The alert sits under the status. Phones get cards. */
const COLS = 9;
function row(c){
  /* When the action column already says Review, the alert under the status is just the reason, not a second button */
  const a = c.alerts, tag = primary(c).includes('data-act="review"') ? 'span' : 'button';
  const alert = !a.length ? '' : a.length === 1 && a[0].kind === 'error'
    ? `<${tag} class="talert error" data-act="review" data-id="${c.id}">${ic('alert')}${esc(a[0].title)}</${tag}>`
    : `<${tag} class="talert warn" data-act="review" data-id="${c.id}">${ic('warn')}${a.length} alert${a.length>1?'s':''}</${tag}>`;
  const n = v => c.imp != null ? v : '<span class="dash">–</span>';
  const when = c.dates ? `${esc(span(c))}<small>${esc(c.left || '')}</small>` : '<span class="dash">Not set</span>';
  return `<tr class="trow" data-act="open" data-id="${c.id}" tabindex="0" aria-label="${esc(c.name)} details" aria-current="${state.open === c.id}">
    <td class="tprim">${primary(c)}</td>
    <td><div class="tname"><span class="thumb tthumb">${c.cre.length ? creative(c.cre[0]) : '<div class="cre-empty"></div>'}</span>
      <div><b>${esc(c.name)}</b>${c.opt ? '<span class="tag-opt">Blip optimized</span>' : ''}</div></div></td>
    <td class="tstat"><span class="status ${c.status}"><i></i>${c.label}</span>${alert}</td>
    <td class="tmod">${modCell(c)}</td>
    <td class="num">${n(c.imp)}</td><td class="num">${n(c.spend)}</td><td class="num">${n(c.blips)}</td>
    <td class="when">${when}</td>
    <td class="tacts"><button class="ciconb" data-act="edit" data-id="${c.id}" aria-label="Edit ${esc(c.name)}">${ic('pencil')}</button></td></tr>`;
}
function secHead(k, title, hint, count, open, tag){
  const inner = `<button class="lsec-b" data-act="sec" data-s="${k}" aria-expanded="${open}">${ic('down')}<span class="tt">${title}</span><span class="cnt">${count}</span>${hint ? `<span class="hint">${hint}</span>` : ''}</button>`;
  return tag === 'tr' ? `<tr class="ghead"><th colspan="${COLS}" scope="colgroup">${inner}</th></tr>` : `<h2 class="lsec-h">${inner}</h2>`;
}
function table(groups){
  const body = groups.map(([s, items]) => {
    if(!s) return `<tbody>${items.map(row).join('')}</tbody>`;
    const open = isOpen(s[0]);
    return `<tbody class="gsec ${s[0]}">${secHead(s[0], s[1], s[2], items.length, open, 'tr')}${open ? items.map(row).join('') : ''}</tbody>`;
  }).join('');
  return `<div class="tbl-wrap"><table class="ctbl">
    <thead><tr><th rowspan="2"><span class="sr">Action</span></th><th rowspan="2">Campaign</th><th rowspan="2">Status</th><th rowspan="2">Moderation</th><th colspan="3" class="grp">Last 7 days</th><th rowspan="2">Dates</th><th rowspan="2"><span class="sr">Edit</span></th></tr>
      <tr><th class="num">Impressions</th><th class="num">Spend</th><th class="num">Blips</th></tr></thead>
    ${body}</table></div>`;
}
function cards(groups){
  return groups.map(([s, items]) => {
    if(!s) return `<div class="grid">${items.map(card).join('')}</div>`;
    const open = isOpen(s[0]);
    return `<section class="lsec ${s[0]}">${secHead(s[0], s[1], s[2], items.length, open)}${open ? `<div class="grid">${items.map(card).join('')}</div>` : ''}</section>`;
  }).join('');
}

/* Search: name only, like the product, but it filters as you type, says when nothing matches (the product's
   no-results message never shows), and points to Archived when the match is there. Searching opens every section. */
const TABS = [['main','Campaigns'],['archived','Archived']];
const inTab = (c, t) => c.tab === t;
const match = c => !state.q.trim() || c.name.toLowerCase().includes(state.q.trim().toLowerCase());
const isOpen = k => !!state.q.trim() || !state.closed[k];
function results(){
  const items = CAMPAIGNS.filter(c => inTab(c, state.tab) && match(c));
  const view = isPhone() ? 'card' : state.view;
  if(items.length){
    const groups = state.tab === 'archived' ? [[null, items]]
      : SECS.map(s => [s, items.filter(c => secOf(c) === s[0]).sort((a, b) => s[0] === 'active' ? RUN_ORDER[a.status] - RUN_ORDER[b.status] : 0)]).filter(g => g[1].length);
    return view === 'table' ? table(groups) : cards(groups);
  }
  if(!state.q.trim()) return `<div class="empty">${state.tab === 'archived' ? 'Nothing archived.' : 'No campaigns yet.'}</div>`;
  const other = TABS.find(([k]) => k !== state.tab), n = CAMPAIGNS.filter(c => inTab(c, other[0]) && match(c)).length;
  return `<div class="empty"><b>No ${state.tab === 'archived' ? 'archived ' : ''}campaigns match “${esc(state.q.trim())}”</b>
    ${n ? `<p><button class="linkbtn" data-act="tab" data-t="${other[0]}">${n} in ${other[1]}</button></p>` : ''}
    <button class="btn secondary" data-act="clearQ">Clear search</button></div>`;
}
function list(){
  const tabs = TABS.map(([k,l]) => `<button role="tab" aria-selected="${state.tab===k}" data-act="tab" data-t="${k}">${l}</button>`).join('');
  const viewBtn = state.view === 'table'
    ? `<button class="viewbtn" data-act="view" data-v="card">${ic('cards')}Card view</button>`
    : `<button class="viewbtn" data-act="view" data-v="table">${ic('rows')}List view</button>`;
  return `<div class="head"><div class="head-top">
      <div class="head-l"><h1>Campaigns</h1>
        <div class="head-acts"><button class="btn primary" data-act="create">${ic('plus')}Create</button><button class="btn secondary" data-act="moderation">Check moderation</button></div></div>
      <div class="lctl">${viewBtn}<label class="search">${ic('search')}<input id="q" type="search" placeholder="Search by name" aria-label="Search campaigns by name" autocomplete="off" value="${esc(state.q)}">
        <button class="qx" data-act="clearQ" aria-label="Clear search" ${state.q ? '' : 'hidden'}>${ic('close')}</button></label></div></div>
      <div class="tabs" role="tablist">${tabs}</div></div>
    <div id="results">${results()}</div>`;
}

/* ---------- Mockup image ----------
   The label is baked into every exported file so the disclaimer travels with the image:
   team version = the photo mockup labeled "Preview only"; social version = the Billboard Maker marketing scene with a
   "Made with Blip" mark (presentable, clearly a creation, not a photo of a real board). */
function mockImg(c, v){
  const tag = v === 'social' ? '<span class="ex mwb"><i>blip</i>Made with Blip</span>' : '<span class="ex">Preview only</span>';

/* ---------- Moderation card (look A) ----------
   Moderation only. Colored text names the state (Approved / In review / Rejected) and the count sits beside it, with
   "See details" on the same line when something on some boards isn't approved. When rejections block delivery, the
   banner at the top of the drawer offers Replace creative; the card never repeats it. Both go to the editor's
   creative step (Creative for Blip optimized, Design for the others). */
function modCounts(rows){ return rows.reduce((t,r) => (t.boards += r[1], t.ok += r[2], t.wait += r[3], t.bad += r[4], t.none += (r[5]||0), t), {boards:0, ok:0, wait:0, bad:0, none:0}); }
function modRows(rows){
  return rows.map(([dim, n, ok, wait, bad, none]) => {
    const tags = none === n ? '<span class="ctag none">No creative</span>' : ok === n ? '<span class="ctag ok">Approved</span>' : wait === n ? '<span class="ctag wait">In review</span>' : bad === n ? '<span class="ctag bad">Rejected</span>'
      : [ok && `<span class="ctag ok">${ok} approved</span>`, wait && `<span class="ctag wait">${wait} in review</span>`, bad && `<span class="ctag bad">${bad} rejected</span>`].filter(Boolean).join('');
    return `<div class="mod-row"><div><b>${dim}</b><small>${n} board${n>1?'s':''}</small></div><span class="tags">${tags}</span></div>`;
  }).join('');
}
function modHTML(c){
  const m = c.mod; if(!m) return '';
  const t = modCounts(m.rows);
  const PILL = {ok:'Approved', review:'In review', fix:'Rejected', none:'Not started'};
  let line, see = false, extra = '';
  /* Each part stays whole, so a narrow drawer wraps between parts, never inside one */
  const parts = a => a.filter(Boolean).map(x => `<span class="nw">${x}</span>`).join(' · ');
  if(m.state === 'review') line = parts([`${t.boards} boards`, 'Usually 1–2 business days']);
  else if(m.state === 'none') line = parts(['No creative to review yet']);
  else if(m.state === 'fix'){
    /* The banner at the top holds the fix; the card only reports the state. No reason here: it can be "Other",
       or come from the sign owner rather than Blip, so the reasons stay in the editor behind See details. */
    line = parts([`${t.bad} of ${t.boards} boards`]);
    see = true;
  } else {
    line = parts([`${t.ok} of ${t.boards} boards`, t.bad && `${t.bad} rejected`, t.wait && `${t.wait} in review`, t.none && `${t.none} need a creative`]);
    see = t.ok < t.boards;
  }
  const list = state.modOpen ? `<div class="mod-list">${modRows(m.rows)}</div>` : '';
  return `<section class="sec"><div class="sec-h"><h3>Moderation</h3></div>
    <div class="mod ${m.state} ${state.focus==='mod'?'flash':''}" id="modCard">
      <div class="mod-top"><div class="mod-hl"><span class="mword ${m.state}">${PILL[m.state]}</span><span class="ln">${line}</span>${see ? '<button class="linkbtn" data-act="seeMod">See details</button>' : ''}</div>${extra}</div>
      <button class="mod-tg" data-act="modToggle" aria-expanded="${!!state.modOpen}"><span>By sign dimension</span>${ic('down')}</button>${list}
    </div></section>`;
}

/* ---------- Draft drawer ----------

/* ---------- Render + actions ---------- */
/* Re-rendering rebuilds the drawer, which would reset its scroll. Keep the scroll position when the same drawer
   view re-renders (toggles, toasts); reset only when moving somewhere else (another campaign or a share view). */
let lastDrawerView = null;
function render(){
  const view = state.open ? `${state.open}|${state.sv || ''}` : null;
  const prevBody = $('.dbody'), prevTop = prevBody ? prevBody.scrollTop : 0;
  const qFocus = document.activeElement && document.activeElement.id === 'q', qSel = qFocus ? document.activeElement.selectionStart : 0;
  $('#main').innerHTML = list();
  if(qFocus){ const q = $('#q'); q.focus({preventScroll:true}); q.setSelectionRange(qSel, qSel); }
  $('#drawer').innerHTML = drawerHTML();
  if (view && view === lastDrawerView){ const b = $('.dbody'); if (b) b.scrollTop = prevTop; }
  lastDrawerView = view;
  $('#toast').innerHTML = state.toast ? `<div class="toast" role="status">${esc(state.toast)}</div>` : '';
  document.documentElement.style.overflow = state.open ? 'hidden' : '';
  if(state.enter){ state.enter = false; const d = $('.drawer'); d && d.focus && d.setAttribute('tabindex','-1'); d && d.focus({preventScroll:true}); }
  if(state.focus === 'alerts'){ const a = $('.alert'); a && a.scrollIntoView({block:'nearest'}); }
  /* Wait for the drawer's slide-in to finish, or the scroll gets lost */
  syncPicker();
}
let tt;
function toast(m){ state.toast = m; render(); clearTimeout(tt); tt = setTimeout(() => { state.toast = ''; render(); }, 2600); }
function open(id, focus){
  state.details = getC(id).status === 'draft'; state.modOpen = false; state.open = id; state.focus = focus || null; state.menu = false; state.enter = true; render(); }
function close(){
  const v = $('.veil'), done = () => { state.open = null; state.menu = false; state.focus = null; render(); };
  if(!v || matchMedia('(prefers-reduced-motion: reduce)').matches) return done();
  v.classList.add('leave'); setTimeout(done, 200);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t) { if(state.menu){ state.menu = false; render(); } return; }
  const a = t.dataset.act, id = t.dataset.id;
  if(a !== 'menu' && state.menu){ state.menu = false; }
  switch(a){
    case 'open': open(id); break;
    case 'review': e.stopPropagation(); open(id, 'alerts'); break;
    case 'close': if(e.target === t || t.closest('.dback, .dx')){ state.sv = null; close(); } break;
    case 'tab': state.tab = t.dataset.t; render(); break;
    case 'menu': state.menu = !state.menu; render(); break;
    case 'details': state.details = !state.details; render(); break;
    case 'toggle': { const c = getC(id || state.open); if(c.status === 'running'){ c.status = 'paused'; c.label = 'Paused'; toast(`${c.name} paused`); } else { c.status = 'running'; c.label = 'Running'; toast(`${c.name} started`); } break; }
    case 'edit': toast('Opens the campaign builder'); break;
    case 'replace': { const c = getC(state.open); toast(`Opens the ${c.opt ? 'Creative' : 'Design'} step in the editor, where each rejection reason is listed`); break; }
    case 'seeMod': { const c = getC(state.open); toast(`Opens the ${c.opt ? 'Creative' : 'Design'} step in the editor, with the rejection reasons`); break; }
    case 'seeCre': { const c = getC(state.open); toast(`Opens the ${c.opt ? 'Creative' : 'Design'} step in the editor, with every creative and size`); break; }
    case 'setupStep': toast(`Opens the campaign editor at ${t.dataset.step.charAt(0).toUpperCase() + t.dataset.step.slice(1)}`); break;
    case 'runAgain': { const c = getC(state.open); toast(`Duplicates ${c.name} as a new ${c.runDays}-day campaign starting today, then opens it to review before launch`); break; }
    case 'launch': toast('Submits the campaign for moderation'); break;
    case 'deleteDraft': toast('Asks to confirm, then deletes the draft'); break;
    case 'modToggle': state.modOpen = !state.modOpen; state.focus = null; render(); break;
    case 'pay': toast('Opens payment settings'); break;
    case 'download': { const c = getC(state.open); toast(`Downloaded ${slug(c)}-mockups.zip · 2 images`); break; }
    case 'sv': state.sv = t.dataset.v; state.to = ['Me']; state.msg = ''; state.toBad = false; state.menu = false; render(); setTimeout(() => $('#svTo') && $('#svTo').focus(), 0); break;
    case 'svBack': state.sv = null; render(); break;
    case 'copyLink': toast('Link copied. Anyone with access to this account can open it.'); break;
    case 'rmTo': state.to.splice(+t.dataset.i, 1); render(); $('#svTo').focus(); break;
    case 'svSend': { addTo($('#svTo').value); const n = state.to.length;
      if(!n){ state.toBad = true; render(); $('#svTo').focus(); break; }
      const what = 'Mockup';
      const who = n === 1 && state.to[0] === 'Me' ? 'the account email' : `${n} ${n === 1 ? 'person' : 'people'}`;
      state.sv = null; toast(`${what} sent to ${who}`); break; }
    case 'duplicate': toast('Duplicated as a draft'); break;
    case 'archive': toast('Moved to Archived'); break;
    case 'unarchive': toast('Moved back to Active'); break;
    case 'analytics': toast('Opens the Analytics page for this campaign'); break;
    case 'view': state.view = t.dataset.v; render(); break;
    case 'sec': e.stopPropagation(); state.closed[t.dataset.s] = !state.closed[t.dataset.s]; render(); break;
    case 'clearQ': state.q = ''; render(); $('#q').focus(); break;
    case 'create': toast('Opens the campaign builder'); break;
    case 'moderation': toast('Opens moderation status'); break;
    case 'help': toast('Opens the support hub drawer (not part of this prototype)'); break;
    case 'nav': toast('That page isn’t part of this prototype'); break;
  }
});
function addTo(v){ v.split(/[,;\s]+/).map(x => x.trim()).filter(x => /.+@.+\..+/.test(x) && !state.to.includes(x)).forEach(x => state.to.push(x)); if(state.to.length) state.toBad = false; }
document.addEventListener('input', e => {
  if(e.target.id === 'svMsg') state.msg = e.target.value;
  if(e.target.id === 'q'){ state.q = e.target.value; $('#results').innerHTML = results(); $('.qx').hidden = !state.q; syncPicker(); }
  if(e.target.id === 'svTo' && /[,;]/.test(e.target.value)){ addTo(e.target.value); render(); $('#svTo').focus(); }
});
document.addEventListener('keydown', e => {
  if(e.target.id !== 'svTo') return;
  if((e.key === 'Enter' || e.key === ',') && e.target.value.trim()){ e.preventDefault(); addTo(e.target.value); render(); $('#svTo').focus(); }
  else if(e.key === 'Backspace' && !e.target.value && state.to.length){ state.to.pop(); render(); $('#svTo').focus(); }
});
document.addEventListener('focusout', e => { if(e.target.id === 'svTo' && e.target.value.trim() && !e.relatedTarget?.closest?.('[data-act="svSend"]')){ addTo(e.target.value); e.target.value = ''; render(); } });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && state.sv){ state.sv = null; render(); return; }
  if(e.key === 'Escape' && state.open) close();
  if(e.key === 'Escape' && e.target.id === 'q' && state.q){ state.q = ''; render(); $('#q').focus(); return; }
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches('.ccard, .trow')){ e.preventDefault(); e.target.click(); }
});

/* ---------- Step picker ---------- */
const STEPS = [
  ['Campaigns', [['list','Card view, in sections'],['table','List view (table), in sections'],['archivedTab','Archived tab'],['search','Search: matches'],['searchNone','Search: no match, found in Archived']]],
  ['Draft drawer', [['draftOpen','Draft, setup not finished'],['draftNoCre','Draft, no creative yet'],['draftReady','Draft, ready to launch']]],
  ['Banners', [['rejected','Creative rejected (blocking)'],['bnFit','Creative doesn’t fit (blocking)'],['bnSizesB','Sign sizes missing a creative (blocking)'],['bnSizesW','1 sign size missing a creative (warning)'],['bnUnavail','Selected boards unavailable (blocking)'],['bnExpand','Not enough boards nearby (warning)'],['bnMaxed','Area is maxed out (warning)']]],
  ['Details drawer · moderation lifecycle', [['review','1 · Submitted, in review'],['running','2 · Running, partly approved (quiet)'],['rejected','3 · Rejected, can’t spend (from Review →)'],['alerts','4 · Paused'],['ended','5 · Ended']]],
  ['Share', [['svMockup','Share mockup (email)']]],
  ['Entry points', [['email','From the “campaign is live” email']]]
];
const ORDER = STEPS.flatMap(([,s]) => s.map(x => x[0]));
$('#stateSel').innerHTML = STEPS.map(([g,s]) => `<optgroup label="${g}">${s.map(([k,l]) => `<option value="${k}">${l}</option>`).join('')}</optgroup>`).join('');
function jump(k){
  state.tab = k === 'archivedTab' ? 'archived' : 'main'; state.view = k === 'table' ? 'table' : 'card'; state.closed = {};
  state.q = k === 'search' ? 'tire' : k === 'searchNone' ? 'holiday' : ''; state.open = null; state.menu = false; state.focus = null; state.toast = ''; state.sv = null;
  if(k === 'svMockup'){ open('fall'); state.sv = 'mockup'; state.to = ['Me']; state.msg = ''; state.toBad = false; render(); $('#stateSel').value = k; return; }
  if(k === 'running') open('fall'); else if(k === 'rejected') open('winter', 'alerts'); else if(k === 'alerts') open('summer', 'alerts');
  else if(k === 'draftOpen'){ open('hours'); }
  else if(k === 'draftNoCre'){ open('grand'); }
  else if(k === 'draftReady'){ open('tuneup'); }
  else if(k === 'ended'){ open('spring'); }
  else if(k.startsWith('bn')) open(k);
  else if(k === 'review') open('oil'); else if(k === 'email'){ open('fall'); toast('Opened from the email’s “View campaign performance” link'); }
  else render();
  $('#stateSel').value = k;
}
function current(){
  if(!state.open){
    if(state.q) return state.q === 'tire' ? 'search' : state.q === 'holiday' ? 'searchNone' : 'list';
    return state.tab === 'archived' ? 'archivedTab' : state.view === 'table' ? 'table' : 'list';
  }
  if(state.sv) return 'svMockup';
  return {hours:'draftOpen', grand:'draftNoCre', tuneup:'draftReady', fall:'running', winter:'rejected', bnFit:'bnFit', bnSizesB:'bnSizesB', bnSizesW:'bnSizesW', bnUnavail:'bnUnavail', bnExpand:'bnExpand', bnMaxed:'bnMaxed', summer:'alerts', oil:'review', spring:'ended'}[state.open] || 'list';
}
function syncPicker(){
  const sel = $('#stateSel'); if(document.activeElement !== sel && sel.value !== 'email') sel.value = current();
  const i = ORDER.indexOf(sel.value); $('#spPrev').disabled = i <= 0; $('#spNext').disabled = i >= ORDER.length - 1;
}
$('#stateSel').addEventListener('change', e => jump(e.target.value));
$('#spPrev').addEventListener('click', () => jump(ORDER[Math.max(0, ORDER.indexOf($('#stateSel').value) - 1)]));
$('#spNext').addEventListener('click', () => jump(ORDER[Math.min(ORDER.length - 1, ORDER.indexOf($('#stateSel').value) + 1)]));

/* Deep link: the "campaign is live" email opens Campaigns with that campaign's drawer, e.g. campaign-overview.html#open-fall */
const m = location.hash.match(/^#open-(\w+)$/);
if(m && getC(m[1])) open(m[1]); else render();
})();
</script>
